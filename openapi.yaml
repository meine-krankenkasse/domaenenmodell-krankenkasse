  /personen/{person_id}/aufgaben:
    parameters:
    - name: person_id
      in: path
      required: true
      description: Ressourcen-ID der Person.
      schema:
        $ref: '#/components/schemas/person_id'
    get:
      tags:
      - aufgaben
      operationId: aufgaben_lesen
      summary: Aufgaben einer Person unabhängig vom Bearbeiter lesen
      description: |
        Liefert die Aufgaben der angegebenen Person unabhängig davon, welchem Bearbeiter sie
        zugewiesen sind. Auch Aufgaben ohne Bearbeiterzuweisung und alle Statuswerte sind enthalten.
        Der Aufrufer muss keinen Bearbeiter angeben. Eine Bearbeiterzuweisung ist kein Leserecht
        und darf den Abruf nicht auf eigene Aufgaben oder die eines ausgewählten Mitarbeiters begrenzen.
        Der Abruf dient dem fachlichen Überblick zur Person, auch für Anwendungen und KI-Agenten.
        Er liefert den aktuellen Aufgabenbestand, keine Historie früherer Zuweisungen oder Änderungen.

        Die allgemeinen Regeln für Authentisierung, Personenzugriff und Zugriffskontext gelten weiter.
        Zusätzliche aufgabenspezifische Lesebeschränkungen sind nicht als bestätigt vorausgesetzt;
        tatsächlich erforderliche Regeln sind vor Freigabe zu klären. Die API darf eine technisch
        auf einzelne Bearbeiter begrenzte Quellantwort nicht als personenweiten Abruf ausgeben.
        Kann der zugesagte Umfang nicht vollständig ermittelt werden, gilt 503 statt einer Teilantwort.

        Die Liste ist nach id aufsteigend sortiert. Erforderliche Berechtigungsprüfungen erfolgen vor
        versatz und seitengroesse. naechster_versatz wird nur bei weiteren zugänglichen Treffern
        geliefert; Folgeaufrufe verwenden unveränderte Person und Seitengröße. Zwischen Aufrufen
        sind Änderungen und damit Überschneidungen oder Auslassungen möglich; kein konsistenter
        Schnappschuss. Eine unvollständige Quellantwort darf nicht als letzte Seite ausgegeben werden.
      responses:
        '200':
          description: Zugängliche Daten im beschriebenen Umfang.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aufgabenliste'
        '400':
          $ref: '#/components/responses/ungueltige_anfrage'
        '401':
          $ref: '#/components/responses/nicht_authentifiziert'
        '403':
          $ref: '#/components/responses/zugriff_abgelehnt'
        '404':
          $ref: '#/components/responses/person_nicht_gefunden'
        '500':
          $ref: '#/components/responses/interner_fehler'
        '503':
          $ref: '#/components/responses/dienst_nicht_verfuegbar'
      x-mcp_annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
      parameters:
      - name: seitengroesse
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: versatz
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
    post:
      tags:
      - aufgaben
      operationId: aufgabe_anlegen
      summary: Eine Aufgabe zur Person anlegen
      description: 'Legt nach ausdrücklichem fachlichem Auftrag eine Aufgabe anhand einer freigegebenen
        Aufgabendefinition an. Status bei Anlage ist unbearbeitet; Zuweisung und weitere Standardwerte werden
        automatisch aus der Definition bestimmt. Ein fehlendes wiedervorlagedatum verwendet den konfigurierten
        Standard; es bedeutet nicht ausdrücklich keine Wiedervorlage. Die Bearbeiterzuweisung begrenzt den personenweiten Aufgabenabruf nicht. Die Anlage ändert keine bestehende
        Aufgabe und dokumentiert keinen Kontakt. Unbekannte Felder, leere Pflichtwerte, ungültige Datumswerte
        und überschrittene Textgrenzen ergeben 400; Inhalte werden nicht gekürzt. Eine unbekannte, inaktive
        oder nicht freigegebene Definition oder nicht verlustfrei abbildbare Eingabe ergibt 422 aufgabe_nicht_abbildbar
        ohne Schreibbeginn.
  
  
        Die API prüft Schreibberechtigung und eindeutige Personenzuordnung vor dem Schreiben. Fehlende Schreibberechtigung
        ergibt 403, eine unbekannte oder nicht zugängliche Person 404. 201 bestätigt ausschließlich die
        dauerhafte Anlage mit bestätigter Zuordnung zur angefragten Person. Ein unklarer Ausgang oder eine
        unbestätigte Zuordnung ergibt 503 mit gesperrtem Auftrag. Kein blindes erneutes Anlegen; 500 und
        503 beweisen keine Wirkungslosigkeit. Die Bestätigung enthält keine Aufgabeninhalte und gewährt
        kein Leserecht.
  
  
        Idempotency-Key ist Pflicht.
        Ein neuer Schlüssel ist ein neuer Auftrag und kann eine weitere Aufgabe erzeugen; eine inhaltsbasierte
        Dublettenprüfung ist nicht zugesagt.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Schlüssel zur Vermeidung doppelter Schreibwirkungen bei Wiederholungen.
        schema:
          $ref: '#/components/schemas/idempotenzschluessel'
        example: 06a37d58-d26f-4ee6-9b26-41ff8bea57a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aufgabe_anlage'
      responses:
        '201':
          description: Aufgabe dauerhaft angelegt und der Person zugeordnet; derselbe Schlüssel wiederholt
            diesen Status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aufgabe_annahme'
        '400':
          $ref: '#/components/responses/ungueltige_anfrage'
        '401':
          $ref: '#/components/responses/nicht_authentifiziert'
        '403':
          $ref: '#/components/responses/zugriff_abgelehnt'
        '404':
          $ref: '#/components/responses/person_nicht_gefunden'
        '500':
          $ref: '#/components/responses/interner_fehler'
        '503':
          $ref: '#/components/responses/dienst_nicht_verfuegbar'
        '409':
          description: Auftrag läuft oder Eingaben stehen im Konflikt.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
            Retry-After:
              description: Bei auftrag_in_bearbeitung vorhanden; frühester erneuter Versuch in Sekunden
                mit demselben Schlüssel.
              schema:
                type: integer
                minimum: 1
              example: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fehler'
              examples:
                abweichender_auftrag:
                  value:
                    code: idempotenzkonflikt
                    meldung: Der Schlüssel gehört zu einem anderen Auftrag.
                laufender_auftrag:
                  value:
                    code: auftrag_in_bearbeitung
                    meldung: Bitte denselben Auftrag nach der angegebenen Wartezeit wiederholen.
        '422':
          description: 'aufgabe_nicht_abbildbar: Definition oder Eingabe fachlich nicht umsetzbar; keine
            Anlage.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fehler'
      x-mcp_annotations:
        readOnlyHint: false
        destructiveHint: false
        idempotentHint: true
components:
  securitySchemes:
    zugriffsnachweis:
      type: http
      scheme: bearer
      description: Vorschlag für einen überprüfbaren Zugriffsnachweis; Tokenformat, Aussteller und Kontextbindung sind offen.
  headers:
    keine_speicherung:
      description: Personenbezogene Antworten dürfen nicht zwischengespeichert werden.
      schema:
        type: string
        const: no-store
  schemas:
    ressourcen_id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: Undurchsichtige ID im API-Mandantenkontext; keine fachliche Kennung und kein Berechtigungsnachweis.
    adresse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ressourcen_id'
        strasse:
          type: string
          minLength: 1
        hausnummer:
          type: string
          minLength: 1
        postfach:
          type: string
          minLength: 1
        postleitzahl:
          type: string
          minLength: 1
        ort:
          type: string
          minLength: 1
        zusatz:
          type: string
          minLength: 1
        land:
          type: string
          minLength: 1
        adresse_in_pruefung:
          type: boolean
        art:
          type: string
          enum:
          - meldeadresse
          - zustelladresse
      required:
      - id
      - art
      description: Eigene postalische Adresse. land ist die Länderbezeichnung. Unbekannte Bestandteile entfallen;
        Postfachadressen benötigen keine Straße. Getrennte Adresszuordnungen werden nicht anhand gleicher
        Anschrift zusammengeführt.
      examples:
      - id: adresse-001
        strasse: Beispielweg
        hausnummer: '7'
        postleitzahl: '12345'
        ort: Beispielstadt
        land: Deutschland
        art: meldeadresse
    adressliste:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/adresse'
      required:
      - data
    kontaktdatum:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ressourcen_id'
        art:
          type: string
          enum:
          - telefon
          - mobil
          - e_mail
        wert:
          type: string
          minLength: 1
          description: Gespeicherte Telefonnummer einschließlich bekannter Vorwahlen oder E-Mail-Adresse;
            keine Zusage eines verifizierten oder erreichbaren Anschlusses.
        verwendungszweck:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
          examples:
          - privat
          - geschaeftlich
        bevorzugt:
          type: boolean
        bemerkung:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - id
      - art
      - wert
      examples:
      - id: kontaktdatum-001
        art: e_mail
        wert: person@example.org
        verwendungszweck: privat
        bevorzugt: true
    kontaktdatenliste:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/kontaktdatum'
      required:
      - data
    betreuungshinweis:
      type: object
      properties:
        art:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
          description: Fachlicher Betreuungstyp aus dem vor Freigabe abzustimmenden Katalog. Keine Ableitung aus einer allgemeinen
            Personenrolle.
          examples:
          - betreuer_gesamt
          - betreuer_gesundheitssorge
          - betreuer_vermoegenssorge
        betreuer_person_id:
          $ref: '#/components/schemas/person_id'
          description: Nur für einen zugänglichen Betreuer als natürliche Person; Organisationen werden nicht
            als Personen ausgegeben.
        bezeichnung:
          type: string
          minLength: 1
          description: Zugängliche Bezeichnung der betreuenden Person oder Stelle.
        gueltig_ab:
          type: string
          format: date
        gueltig_bis:
          type: string
          format: date
        hinweis:
          type: string
          minLength: 1
          maxLength: 3000
      required:
      - art
      description: Aktuell gültiger dokumentierter Betreuungshinweis. Offene Gültigkeitsgrenzen entfallen.
        Kein eigenständiger Nachweis einer konkreten Vertretungsbefugnis oder eines Zugriffsrechts.
      examples:
      - art: betreuer_gesundheitssorge
        bezeichnung: Beispielbetreuung
        gueltig_ab: '2026-01-01'
    aufgabenstatus:
      type: string
      enum:
      - unbearbeitet
      - in_bearbeitung
      - erledigt
      - in_wiedervorlage
      - nachbearbeitung_laeuft
      - storniert
      - weitergeleitet
    aufgabe_anlage:
      type: object
      properties:
        aufgabendefinitionsname:
          type: string
          minLength: 1
          maxLength: 120
          description: Name einer freigegebenen, aktiven Aufgabendefinition; steuert Standardwerte und automatische
            Zuweisung.
        info:
          type: string
          minLength: 1
          maxLength: 50
        bemerkung:
          type: string
          minLength: 1
          maxLength: 2000
        vorgangsnotiz:
          type: string
          minLength: 1
          maxLength: 1200
        wiedervorlagedatum:
          type: string
          format: date
          description: Fachliches Datum ohne Uhrzeit.
      required:
      - aufgabendefinitionsname
      additionalProperties: false
      examples:
      - aufgabendefinitionsname: Allgemeine Bearbeitung
        info: Rückfrage prüfen
        bemerkung: Die vorliegenden Angaben prüfen.
        wiedervorlagedatum: '2026-11-10'
    aufgabe:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ressourcen_id'
        status:
          $ref: '#/components/schemas/aufgabenstatus'
        info:
          type: string
          minLength: 1
          maxLength: 50
        bemerkung:
          type: string
          minLength: 1
          maxLength: 2000
        vorgangsnotiz:
          type: string
          minLength: 1
          maxLength: 1200
        wiedervorlagedatum:
          type: string
          format: date
          description: Fachliches Datum ohne Uhrzeit.
        erstellt_am:
          type: string
          format: date-time
        geschlossen_am:
          type: string
          format: date
        bearbeiter_id:
          $ref: '#/components/schemas/ressourcen_id'
      required:
      - id
      description: Zugängliche Aufgabenangaben. Fehlende Felder bedeuten nicht geliefert. bemerkung und vorgangsnotiz
        geben den aktuellen Inhalt wieder, keine Änderungshistorie.
      examples:
      - id: aufgabe-001
        status: unbearbeitet
        info: Rückfrage prüfen
        bearbeiter_id: mitarbeiter-001
    aufgabenliste:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/aufgabe'
          maxItems: 100
        naechster_versatz:
          type: integer
          minimum: 1
      required:
      - data
      examples:
      - data: []
    aufgabe_annahme:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ressourcen_id'
        person_id:
          $ref: '#/components/schemas/person_id'
      required:
      - id
      - person_id
      examples:
      - id: aufgabe-001
        person_id: person-001
    kontakt_id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: Undurchsichtige Ressourcen-ID eines Kontakts im Mandantenkontext.
    kontaktkanal:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9_]*$
      description: |
        Fachlicher Kontaktweg als stabiler Code. Der Katalog ist erweiterbar; Clients müssen
        zusätzliche Antwortcodes tolerieren. anruf und telefon sind unterschiedliche Wege.
        persoenlicher_kontakt bezeichnet persönlichen Kontakt, sonstiger einen bekannten anderen
        Weg und keine unbekannte Angabe. Für Schreibzugriffe und Filter müssen die unterstützten
        Codes vorab vereinbart sein. Unbekannte Werte werden nicht auf sonstiger umgedeutet.
      examples:
      - anruf
      - telefon
      - chat
      - e_mail
      - brief
      - persoenlicher_kontakt
    kontaktstatus:
      type: string
      enum:
      - erledigt
      - storniert
      - in_bearbeitung
      description: Bearbeitungsstatus der Kontaktdokumentation; keine Aussage zur Erledigung des zugrunde liegenden Anliegens.
    kontaktrichtung:
      type: string
      enum:
      - eingehend
      - ausgehend
      description: Richtung aus Sicht der Krankenkasse; weglassen, wenn nicht eindeutig bekannt.
    kontakt_betreff:
      type: string
      minLength: 1
      maxLength: 120
      pattern: \S
      description: Kurzbeschreibung ohne Markup; höchstens 120 Unicode-Codepoints, keine stille Kürzung.
    kontakt_bemerkung:
      type: string
      minLength: 1
      maxLength: 2400
      pattern: \S
      description: Gesprächsdokumentation als Klartext; höchstens 2400 Unicode-Codepoints. Kein vollständiges Transkript erforderlich.
    externe_kontakt_id:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^\S+$
      description: |
        Externe Ereigniskennung in einem für die Anwendung vereinbarten Wertebereich.
        Ein optionales Herkunftspräfix zählt zur Maximallänge. Exakter Vergleich einschließlich
        Groß-/Kleinschreibung. Keine automatische Kürzung oder Normalisierung.
    idempotenzschluessel:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: Zufällige UUIDv4 in kanonischer Kleinschreibung; bei Wiederholungen unverändert verwenden.
    kontakt_anlage:
      type: object
      additionalProperties: false
      required:
      - kontakt_am
      - kanal
      - status
      - betreff
      - bemerkung
      - maschinell_erzeugt
      properties:
        kontakt_am:
          type: string
          format: date-time
          description: Tatsächlicher Zeitpunkt des Kommunikationsereignisses mit Zeitzone, nicht Zeitpunkt der Speicherung.
        kanal:
          $ref: '#/components/schemas/kontaktkanal'
        status:
          $ref: '#/components/schemas/kontaktstatus'
        richtung:
          $ref: '#/components/schemas/kontaktrichtung'
        betreff:
          $ref: '#/components/schemas/kontakt_betreff'
        bemerkung:
          $ref: '#/components/schemas/kontakt_bemerkung'
        maschinell_erzeugt:
          type: boolean
          description: true, wenn die eingereichte Gesprächsdokumentation automatisch erzeugt wurde. Unabhängig vom Kommunikationskanal.
        externe_id:
          $ref: '#/components/schemas/externe_kontakt_id'
      allOf:
      - if:
          properties:
            maschinell_erzeugt:
              const: true
          required:
          - maschinell_erzeugt
        then:
          required:
          - externe_id
    kontakt:
      type: object
      required:
      - id
      description: |
        Kommunikationsereignis mit im Aufrufkontext zugänglichen Angaben. Optionale Felder werden
        bei fehlender Kenntnis oder Freigabe weggelassen; das ist kein fachlicher Negativbefund.
        Fehlende maschinell_erzeugt-Angaben dürfen nicht als false interpretiert werden.
        Die Textgrenzen der Anlage gelten nicht rückwirkend für bestehende Kontaktdokumentationen.
      properties:
        id:
          $ref: '#/components/schemas/kontakt_id'
        kontakt_am:
          type: string
          format: date-time
          description: Zeitpunkt des Kommunikationsereignisses mit verlässlich bestimmter Zeitzone; fehlt bei unbekannter Zeit. Kein Ersatz durch den Erstellungszeitpunkt.
        kanal:
          $ref: '#/components/schemas/kontaktkanal'
        richtung:
          $ref: '#/components/schemas/kontaktrichtung'
        status:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Bearbeitungsstatus, beispielsweise erledigt, storniert oder in_bearbeitung. Weitere Antwortcodes müssen toleriert werden; unbekannte Angaben fehlen.
        betreff:
          type: string
          description: Zugängliche Kurzbeschreibung als Klartext; vorhandene Inhalte werden nicht abgeschnitten.
        bemerkung:
          type: string
          description: Zugängliche Gesprächsdokumentation als Klartext; keine Garantie eines vollständigen Transkripts.
        maschinell_erzeugt:
          type: boolean
          description: Kennzeichnung automatisch erzeugter Dokumentation, soweit bekannt.
        externe_id:
          type: string
          maxLength: 64
          description: Gespeicherte externe Ereigniskennung, soweit bekannt und zugänglich. Bestehende Werte werden unverändert geliefert.
        archiviert:
          type: boolean
          description: Kennzeichnet einen archivierten Kontakt, soweit verlässlich bestimmt. Archivierte Kontakte bleiben im Abruf enthalten.
        erstellt_am:
          type: string
          format: date-time
          description: Erstellungszeitpunkt der Dokumentation mit verlässlich bestimmter Zeitzone; kein Ersatz für kontakt_am.
        fachlicher_inhalt:
          type: string
          description: Fachliche Einordnung des Kontakts als aufgelöste Bezeichnung, soweit bekannt und zugänglich.
        stichwort:
          $ref: '#/components/schemas/kontakt_stichwort'
        herkunft:
          type: string
          description: Fachliche Herkunftsangabe, soweit zugänglich; keine interne System- oder Datenbankzuordnung.
        dokument_id:
          type: string
          minLength: 1
          maxLength: 254
          description: Undurchsichtige Referenz auf ein zugeordnetes Dokument. Kein Zugriffsrecht und keine Zusage einer Dokumentabruf-Fähigkeit.
    kontakt_stichwort:
      type: object
      minProperties: 1
      description: Fachliche Zuordnung mit aufgelösten Bezeichnungen; nur bekannte und zugängliche Bestandteile liefern.
      properties:
        bereich:
          type: string
          minLength: 1
        sachgebiet:
          type: string
          minLength: 1
        prozess:
          type: string
          minLength: 1
    kontaktliste:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/kontakt'
          description: Zugängliche Kontakte dieser Seite in der beschriebenen Sortierung; höchstens seitengroesse Einträge.
        naechster_versatz:
          type: integer
          minimum: 1
          description: Anzahl bereits gelieferter und übersprungener zugänglicher Treffer; fehlt auf der letzten Seite.
    kontakt_annahme:
      type: object
      required:
      - id
      - person_id
      properties:
        id:
          $ref: '#/components/schemas/kontakt_id'
        person_id:
          $ref: '#/components/schemas/person_id'
      description: Minimale Bestätigung der abgeschlossenen oder bereits vorhandenen Dokumentation ohne Gesprächsinhalte.
    person_id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: Undurchsichtige Ressourcen-ID einer Person im API-Mandantenkontext. Keine zugesicherte Gleichheit
        mit einer fachlichen Kennung. Zeichenumfang und Länge sind Entwurfsvorschläge.
      examples:
      - person-beispiel-001
    identifikator_art:
      type: string
      enum:
      - kvnr
      - partnernummer
      - rvnr
      description: |
        Unterstützte Arten:
        kvnr: Lebenslange, kassenübergreifende zehnstellige Krankenversichertennummer (Versicherten-ID).
        Ein Großbuchstabe A bis Z, anschließend neun Ziffern einschließlich abschließender Prüfziffer.
        Frühere kassenindividuelle Versichertennummern und um Kassendaten ergänzte Gesamtkennungen
        sind unter dieser Art nicht zulässig.
        partnernummer: Fachliche Partnernummer innerhalb des Mandantenkontexts.
        rvnr: Rentenversicherungsnummer; Interims-Rentenversicherungsnummern sind nicht eingeschlossen.
    identifikator:
      type: object
      required:
      - art
      - wert
      description: |
        Fachliche Personenkennung. Diese Version liefert nur aktive, aktuell gültige
        Kennungen der drei unterstützten Arten. Historie und Dublettenkennungen sind nicht Bestandteil dieses Umfangs.
        Der Gültigkeitszeitraum beschreibt die Kennung, nicht ein Versicherungsverhältnis.
      properties:
        art:
          $ref: '#/components/schemas/identifikator_art'
        wert:
          type: string
          minLength: 1
          maxLength: 128
          description: Wert als Zeichenfolge einschließlich führender Nullen.
        namensraum:
          type: string
          format: uri
          description: |
            Optionaler ausdrücklich bekannter Geltungsbereich der Kennung.
            Für lokale Partnernummern gilt ohne Angabe der API-Mandantenkontext.
            Vor mandantenübergreifendem Austausch muss ein Namensraum festgelegt werden.
        gueltig_ab:
          type: string
          format: date
          description: Erster Gültigkeitstag, soweit fachlich bekannt; keine technischen Ersatzdaten.
        gueltig_bis:
          type: string
          format: date
          description: Letzter Gültigkeitstag einschließlich; bei offenem Ende weggelassen.
        bestaetigt:
          type: boolean
          description: Kennzeichnet, ob die fachliche Bestätigung der Kennung vorliegt, soweit diese Information
            geliefert wird; kein Identitätsnachweis des Aufrufers.
      allOf:
      - if:
          properties:
            art:
              const: kvnr
          required:
          - art
        then:
          properties:
            wert:
              $ref: '#/components/schemas/kvnr'
    personenrolle:
      type: object
      required:
      - code
      description: Fachliche Einordnung der Person, beispielsweise versicherter, interessent oder pflegeperson.
        Eine solche Rolle belegt allein weder ein aktuell bestehendes Versicherungsverhältnis noch eine Zugriffsberechtigung.
        Konkrete Vertretungsbefugnisse werden durch gesonderte Beziehungen beschrieben. Rollenkatalog und zeitliche
        Aussagekraft sind noch abzustimmen.
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Deutscher fachlicher Code. Offener Katalog; unbekannte Codes müssen toleriert werden.
          examples:
          - versicherter
          - interessent
          - pflegeperson
        bezeichnung:
          type: string
          description: Deutsche Bezeichnung zur Anzeige, nicht zur maschinellen Fallunterscheidung.
    person:
      type: object
      required:
      - id
      description: Natürliche Person unabhängig von ihren Rollen. Nur id ist universell verpflichtend. name wird
        geliefert, wenn mindestens ein zugänglicher Vor- oder Nachname vorliegt. Weitere Daten können unbekannt,
        nicht verfügbar oder nicht freigegeben sein. Der für eine konkrete Nutzung erforderliche
        Datenumfang muss gesondert vereinbart werden.
      properties:
        betreuungshinweise:
          type: array
          items:
            $ref: '#/components/schemas/betreuungshinweis'
          description: Zum Abrufdatum in Europe/Berlin gültige zugängliche Betreuungshinweise, mit einschließlich
            geprüften Gültigkeitsgrenzen. Eine leere Liste wird nur bei geprüftem Nichtvorliegen im freigegebenen
            Umfang geliefert. Fehlendes Feld bedeutet unbekannt, nicht verfügbar oder nicht freigegeben. Keine
            Zusage vollständiger Vollmachtsdaten; keine automatische Entscheidung über Auskunft, Vertretung oder
            Versand.
        id:
          $ref: '#/components/schemas/person_id'
        name:
          $ref: '#/components/schemas/personenname'
        geburtsdatum:
          type: string
          format: date
          description: Vollständig bekanntes Geburtsdatum im Format JJJJ-MM-TT. Bei unbekanntem oder unvollständigem
            Geburtsdatum weggelassen. Keine Ergänzung fehlender Tage oder Monate durch Ersatzwerte. Eine spätere
            Unterstützung von Teilangaben ist offen.
        geschlecht:
          type: string
          enum:
          - maennlich
          - weiblich
          - unbestimmt
          - divers
          description: Fachliche Geschlechtsangabe. Eine unbekannte oder nicht verfügbare Angabe wird weggelassen
            und nicht automatisch als unbestimmt ausgegeben.
        identifikatoren:
          type: array
          description: Zugängliche aktive Identifikatoren der unterstützten Arten; keine Zusage eines vollständigen
            Kennungsbestands.
          items:
            $ref: '#/components/schemas/identifikator'
        rollen:
          type: array
          description: Fachliche Rollen, je code höchstens ein Eintrag. Keine alleinige Aussage zu einem aktuellen
            Versicherungsverhältnis oder einer konkreten Vertretungsbefugnis. Eine leere Liste wird nur geliefert,
            wenn im freigegebenen Umfang tatsächlich keine Rolle besteht; eine fehlende Angabe bedeutet nicht geliefert.
          items:
            $ref: '#/components/schemas/personenrolle'
        schutzstufe:
          type: string
          enum:
          - ungeschuetzt
          - geschuetzt
          - besonders_geschuetzt
          - vip
          description: Fachliche Schutzkennzeichnung, soweit im Zugriffskontext freigegeben. Die API prüft die Zugriffsberechtigung
            vor der Ausgabe. Die Kennzeichnung ist weder eine Zugriffsentscheidung noch eine Auskunftssperre. Die
            konkreten Zugriffsregeln je Schutzstufe sind noch abzustimmen.
    personentreffer:
      type: object
      required:
      - id
      - passende_identifikator_arten
      description: Sparsamer Suchtreffer. Weitere Stammdaten sind über die Ressourcen-ID abrufbar.
      properties:
        id:
          $ref: '#/components/schemas/person_id'
        name:
          $ref: '#/components/schemas/personenname'
        passende_identifikator_arten:
          type: array
          minItems: 1
          uniqueItems: true
          description: Arten, für die der Suchwert bei dieser Person tatsächlich übereinstimmt.
          items:
            $ref: '#/components/schemas/identifikator_art'
    personensuche_ergebnis:
      type: object
      required:
      - auswertung
      - data
      properties:
        auswertung:
          type: string
          enum:
          - kein_treffer
          - eindeutig
          - mehrdeutig
          description: Bewertung ausschließlich der vollständig ermittelten zugänglichen Personen, nicht der Identität
            des Anrufers.
        data:
          type: array
          maxItems: 20
          description: Nach Ressourcen-ID deduplizierte Treffer; keine Rangfolge nach vermuteter Wahrscheinlichkeit.
          items:
            $ref: '#/components/schemas/personentreffer'
      oneOf:
      - properties:
          auswertung:
            const: kein_treffer
          data:
            maxItems: 0
      - properties:
          auswertung:
            const: eindeutig
          data:
            minItems: 1
            maxItems: 1
      - properties:
          auswertung:
            const: mehrdeutig
          data:
            minItems: 2
    fehler:
      type: object
      required:
      - code
      - meldung
      description: Einheitliche Fehlerantwort ohne personenbezogene Suchwerte oder interne Implementierungsdetails.
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stabiler deutscher Fehlercode. Erweiterungen sind möglich.
          examples:
          - ungueltige_anfrage
          - nicht_authentifiziert
          - zugriff_abgelehnt
          - person_nicht_gefunden
          - treffermenge_zu_gross
          - dienst_nicht_verfuegbar
          - interner_fehler
        meldung:
          type: string
          description: Deutsche Erläuterung, nicht zur maschinellen Fallunterscheidung.
        parameter_hinweise:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/parameter_hinweis'
          description: Optionale Hinweise zur gezielten Korrektur einer Anfrage; keine Wiedergabe der Eingabewerte.
    personenname:
      type: object
      minProperties: 1
      anyOf:
      - required:
        - vorname
      - required:
        - nachname
      description: Aktuelle fachliche Namensangabe. Mindestens Vorname oder Nachname ist enthalten. Fehlende Bestandteile
        werden weggelassen; keine leeren Ersatzwerte. Mehrere Vornamen bleiben als gespeicherte Angabe erhalten.
        Namenshistorie und abweichende Korrespondenznamen folgen bei fachlichem Bedarf.
      properties:
        vorname:
          type: string
          description: Gespeicherter Vorname beziehungsweise gespeicherte Vornamen als zusammenhängende Angabe.
          minLength: 1
          pattern: \S
        nachname:
          type: string
          description: Familienname; getrennt gespeicherte Vorsatzwörter und Namenszusätze stehen in eigenen Feldern.
          minLength: 1
          pattern: \S
        vorsatzwort:
          type: string
          description: Gesondert gespeichertes Vorsatzwort zum Nachnamen, beispielsweise von.
          minLength: 1
          pattern: \S
        namenszusatz:
          type: string
          description: Gesondert gespeicherter Namenszusatz, beispielsweise Freiherr.
          minLength: 1
          pattern: \S
        titel:
          type: string
          description: Akademischer Titel als aufgelöste Bezeichnung.
          minLength: 1
          pattern: \S
    kvnr:
      type: string
      minLength: 10
      maxLength: 10
      pattern: ^[A-Z][0-9]{9}$
      description: 'Lebenslange, kassenübergreifende Krankenversichertennummer: zehnstellige Versicherten-ID, bestehend
        aus einem Großbuchstaben und neun Ziffern. Die letzte Ziffer ist die Prüfziffer. Frühere kassenindividuelle
        Nummern sind ausgeschlossen. Dieses Schema prüft ausschließlich Länge und Zeichenaufbau, nicht die Berechnung
        der Prüfziffer.'
    adress_suchkriterien:
      type: object
      additionalProperties: false
      required:
      - land
      anyOf:
      - required:
        - postleitzahl
      - required:
        - ort
      dependentRequired:
        hausnummer:
        - strasse
      description: Kriterien für eine eigene, aktuell gültige Melde- oder Zustelladresse der Person. Land und mindestens
        Postleitzahl oder Ort sind erforderlich. Sämtliche Adresskriterien müssen dieselbe Adresse erfüllen. Anschriften
        von Vertretern oder abweichenden Empfängern zählen nicht als eigene Adresse.
      properties:
        postleitzahl:
          type: string
          minLength: 1
          maxLength: 20
          pattern: \S
          description: Vollständige Postleitzahl als String, einschließlich führender Nullen. Für DE genau fünf
            Ziffern; international sind auch Buchstaben und Zwischenräume möglich.
        ort:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Vollständige Ortsbezeichnung.
        strasse:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Vollständiger Straßenname. Keine automatische Gleichsetzung von Straße und Str. oder anderer
            Abkürzungen.
        hausnummer:
          type: string
          minLength: 1
          maxLength: 30
          pattern: \S
          description: Vollständige Hausnummer einschließlich vorhandenen Zusatzes, beispielsweise 12a.
        land:
          type: string
          pattern: ^[A-Z]{2}$
          description: Land als gültiger ISO-3166-1-Alpha-2-Code, beispielsweise DE. Kein stillschweigender Standardwert.
            Der Zeichenaufbau allein bestätigt noch keinen vergebenen Ländercode.
          examples:
          - DE
          - AT
      allOf:
      - if:
          properties:
            land:
              const: DE
          required:
          - land
        then:
          properties:
            postleitzahl:
              pattern: ^[0-9]{5}$
              minLength: 5
              maxLength: 5
    stammdaten_suchkriterien:
      type: object
      additionalProperties: false
      required:
      - nachname
      anyOf:
      - required:
        - geburtsdatum
      - required:
        - vorname
        - adresse
      description: Bekannte Stammdaten zur Person. Zulässig ist Nachname plus vollständiges Geburtsdatum oder Vorname
        plus Nachname plus Adresse mit Land und mindestens PLZ oder Ort. Zusätzliche bekannte Angaben grenzen die
        Suche weiter ein. Fehlende Kriterien weglassen; keine Platzhalter oder erfundenen Werte. Alle angegebenen
        Kriterien werden mit UND verknüpft.
      properties:
        vorname:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Vollständige bekannte Vornamensangabe. Bei mehreren Vornamen wird die gesamte Angabe verglichen,
            keine automatische Suche nur nach dem ersten Vornamen. Bei Unsicherheit weglassen und Nachname plus
            Geburtsdatum verwenden.
        nachname:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Vollständiger Familienname entsprechend name.nachname; separat geführte Vorsatzwörter und
            Namenszusätze nicht anhängen. Bei unklarer Zerlegung zusätzliche Angaben einholen.
        geburtsdatum:
          type: string
          format: date
          description: Vollständiges Geburtsdatum im Format JJJJ-MM-TT. Teilangaben oder erfundene Ersatzdaten sind
            nicht zulässig.
        adresse:
          $ref: '#/components/schemas/adress_suchkriterien'
    suchtreffer_adresse:
      type: object
      minProperties: 1
      description: Zugänglicher Ausschnitt einer Adresse, die die angegebenen Adresskriterien erfüllt. Keine vollständige
        Adressauskunft. Nur bei einer Suche mit Adresskriterien geliefert.
      properties:
        postleitzahl:
          type: string
          description: Postleitzahl der passenden Adresse einschließlich führender Nullen.
        ort:
          type: string
          description: Ort der passenden Adresse.
        land:
          type: string
          pattern: ^[A-Z]{2}$
          description: Land als ISO-3166-1-Alpha-2-Code.
    stammdaten_personentreffer:
      type: object
      required:
      - id
      description: Person, die sämtliche Suchkriterien erfüllt. Angaben zur Unterscheidung werden nur im zulässigen
        Feldumfang geliefert; eine fehlende Angabe hebt die geprüfte Übereinstimmung nicht auf. Eine Ressourcen-ID
        ist kein Nachweis der Anruferidentität.
      properties:
        id:
          $ref: '#/components/schemas/person_id'
        name:
          $ref: '#/components/schemas/personenname'
        geburtsdatum:
          type: string
          format: date
          description: Geburtsdatum zur Unterscheidung, soweit bekannt und zur Ausgabe freigegeben.
        passende_adressen:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/suchtreffer_adresse'
          description: Zugängliche Ausschnitte der zu den Adresskriterien passenden eigenen Adressen. Bei Suche
            ohne Adresskriterien weggelassen; keine Aussage über den vollständigen Adressbestand.
    stammdatensuche_ergebnis:
      type: object
      required:
      - auswertung
      - data
      properties:
        auswertung:
          type: string
          enum:
          - kein_treffer
          - eindeutig
          - mehrdeutig
          description: Bewertung ausschließlich der vollständig ermittelten zugänglichen Personen, nicht der Identität
            des Anrufers.
        data:
          type: array
          maxItems: 20
          description: Nach Ressourcen-ID deduplizierte Treffer; keine Rangfolge nach vermuteter Wahrscheinlichkeit.
          items:
            $ref: '#/components/schemas/stammdaten_personentreffer'
      oneOf:
      - properties:
          auswertung:
            const: kein_treffer
          data:
            maxItems: 0
      - properties:
          auswertung:
            const: eindeutig
          data:
            minItems: 1
            maxItems: 1
      - properties:
          auswertung:
            const: mehrdeutig
          data:
            minItems: 2
      description: Vollständige, nach Ressourcen-ID deduplizierte Ergebnismenge im zulässigen Zugriffskontext. Ein
        Treffer ist ein Suchkandidat und kein Identitätsnachweis.
    parameter_hinweis:
      type: object
      required:
      - parameter
      - grund
      description: Strukturierter Korrekturhinweis ohne personenbezogene Eingabewerte.
      properties:
        parameter:
          type: string
          description: Betroffener Parameter beziehungsweise Punktpfad im Suchobjekt, beispielsweise adresse.land.
        grund:
          type: string
          description: Maschinenlesbarer deutscher Hinweiscode.
          examples:
          - pflichtangabe_fehlt
          - format_ungueltig
          - suchkombination_unzureichend
          - unbekanntes_feld
  responses:
    ungueltige_anfrage:
      description: Pflichtparameter fehlt, unbekannte Identifikatorart oder ungültiger Parameterwert.
      headers:
        Cache-Control:
          $ref: '#/components/headers/keine_speicherung'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/fehler'
          example:
            code: ungueltige_anfrage
            meldung: Bitte die angegebenen Parameter prüfen.
    nicht_authentifiziert:
      description: Zugriffsnachweis fehlt oder ist ungültig.
      headers:
        WWW-Authenticate:
          description: Erforderliches Authentisierungsschema des Entwurfs.
          schema:
            type: string
            const: Bearer
        Cache-Control:
          $ref: '#/components/headers/keine_speicherung'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/fehler'
          example:
            code: nicht_authentifiziert
            meldung: Ein gültiger Zugriffsnachweis ist erforderlich.
    zugriff_abgelehnt:
      description: Grundsätzliche Aufruffreigabe oder erforderlicher Benutzer-/Versichertenkontext fehlt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/keine_speicherung'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/fehler'
          example:
            code: zugriff_abgelehnt
            meldung: Der Aufruf ist im vorliegenden Zugriffskontext nicht zulässig.
    person_nicht_gefunden:
      description: Die Person ist unbekannt oder im vorliegenden Zugriffskontext nicht zugänglich.
      headers:
        Cache-Control:
          $ref: '#/components/headers/keine_speicherung'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/fehler'
          example:
            code: person_nicht_gefunden
            meldung: Die Person wurde nicht gefunden.
    interner_fehler:
      description: Die Anfrage konnte wegen eines internen Fehlers nicht verarbeitet werden.
      headers:
        Cache-Control:
          $ref: '#/components/headers/keine_speicherung'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/fehler'
          example:
            code: interner_fehler
            meldung: Die Anfrage konnte nicht verarbeitet werden.
    dienst_nicht_verfuegbar:
      description: Die Anfrage kann vorübergehend nicht vollständig und unter Durchsetzung der erforderlichen Berechtigungen
        beantwortet werden; keine Teilantwort.
      headers:
        Cache-Control:
          $ref: '#/components/headers/keine_speicherung'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/fehler'
          example:
            code: dienst_nicht_verfuegbar
            meldung: Die Anfrage kann derzeit nicht vollständig beantwortet werden.
