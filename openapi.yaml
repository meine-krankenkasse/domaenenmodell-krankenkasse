        Abruf gilt 503. Eine leere Liste bedeutet ausschließlich keine Einträge in diesem Umfang, nicht
        das Fehlen zurückgehaltener Daten. Enthalten sind Melde- und Zustelladressen; weitere Adressarten
        sind nicht Teil dieses Abrufs. Getrennte Adresszuordnungen bleiben auch bei gleicher Anschrift erhalten.
        Adressen von Betreuern werden nicht einbezogen. Die Antwort bestimmt keine verbindliche Versandadresse.
        adresse_in_pruefung kennzeichnet eine fragliche Zustellbarkeit; ein fehlendes Kennzeichen ist keine
        Bestätigung der Zustellbarkeit.
      responses:
