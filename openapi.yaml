        Ersatzdatum ausgegeben. Keine Historie und keine Daten anderer Personen. Die Liste ist nach id aufsteigend
        sortiert und wird vollständig im freigegebenen Umfang geliefert, ohne stilles Abschneiden. Bei unvollständigem
        Abruf gilt 503. Eine leere Liste bedeutet ausschließlich keine Einträge in diesem Umfang, nicht
