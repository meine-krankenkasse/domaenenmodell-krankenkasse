openapi: "3.1.0"
info:
  title: Domänenmodell Krankenkasse
  license:
    name: Zero-Clause BSD
    identifier: 0BSD
  version: "0.9.0-entwurf"
  summary: Personen identifizieren, Stammdaten lesen sowie Kontakte und Aufgaben nutzen
  description: |
    # Domänenmodell Krankenkasse
    Ein gemeinsames fachliches Modell mit REST-API-Vertrag für Krankenkassen.

    Das Domänenmodell Krankenkasse beschreibt die fachliche Welt einer Krankenkasse in einem offenen,
    erweiterbaren Domänenmodell mit deutschsprachigem REST-API-Vertrag. Anwendungen und
    KI-Agenten erhalten einen gemeinsamen Zugang, ohne die dahinterliegenden Systeme kennen zu müssen.

    Das Modell dient als Vorlage für APIs und Fassaden. Der erste Umfang orientiert sich eng
    an belegten Fähigkeiten bestehender Krankenkassen-Kernsysteme: ihren Begriffen, Daten und Abläufen.
    Kassen und Dienstleister können weitere fachliche Bereiche ergänzen, auch außerhalb des Kernsystems.
    Zusätzlicher Bedarf wird gezielt auf Umsetzbarkeit geprüft. Angebundene Systeme sollen sich
    weiterentwickeln, ergänzen oder austauschen lassen, ohne den fachlichen Vertrag zu verändern.

    ## Was der Entwurf umfasst
    Personen finden und Stammdaten, Betreuungshinweise, Adressen und Kontaktdaten lesen;
    Kontakte und Aufgaben lesen und anlegen. Nur kontakt_anlegen und aufgabe_anlegen schreiben Daten.
    Der Entwurf ist ein Vorschlag zur Abstimmung, kein verabschiedeter Standard oder Nachweis
    bereits verfügbarer Fähigkeiten. Diese Datei ist mit Beschreibungen, Schemas, Beispielen
    und offenen Entscheidungen eigenständig nutzbar.

    ## Drei Zugriffskontexte
    Maßgeblich ist, in wessen Auftrag eine Anwendung handelt:

    - **Eigenständige Anwendung:** Ein Prozess oder Dienst handelt mit eigener Anwendungsberechtigung.
      Eine individuelle Mitarbeiteridentität ist dafür nicht erforderlich.
    - **Mitarbeiter:** Eine Anwendung unterstützt einen bestimmten Mitarbeiter und führt dessen Kontext mit.
    - **Versicherter:** Eine App oder ein Chat handelt für einen angemeldeten Versicherten.
      Vertretungen benötigen eine gesondert nachgewiesene Befugnis; die Ausgestaltung ist noch offen.

    KI-Agenten können in allen drei Kontexten arbeiten. Ob ein Prozess KI nutzt oder im Hintergrund
    läuft, ändert seinen Auftraggeber nicht. Anmeldung und Berechtigungsprüfung gehören zu jedem
    Zugriff; die technischen Nachweise werden noch vereinbart.

    ## Personen finden und verstehen
    Eine Person ist ein natürlicher Mensch, unabhängig von Versicherung und fachlichen Rollen.
    Ihre id bezeichnet den Datensatz im jeweiligen Mandanten, also dem abgegrenzten Datenbestand.
    Sie ist eine undurchsichtige Kennung und nicht mit einer Versicherungsnummer gleichzusetzen.
    Ihre Beständigkeit, auch beim Zusammenführen von Datensätzen, ist noch festzulegen.

    Die Suche funktioniert in jedem Zugriffskontext: mit bekannter ID, einer Kennung bekannter
    oder unbekannter Art oder mit ausreichenden Stammdaten. Bei Kennungen aus Dokumenten verarbeitet
    die API den extrahierten Wert, nicht das Dokument. Unterstützte Arten sind kvnr, partnernummer
    und rvnr. Mehrdeutige Treffer erfordern weitere Angaben oder eine bestätigte Auswahl;
    bei zu vielen Treffern müssen die Suchkriterien eingegrenzt werden. Fehlende Angaben werden nicht erfunden.

    KVNR meint ausschließlich die lebenslange, kassenübergreifende zehnstellige Versicherten-ID:
    ein Großbuchstabe und neun Ziffern, davon die letzte als Prüfziffer. Ein Kassenwechsel ändert sie
    grundsätzlich nicht. Frühere kassenindividuelle Nummern und um Kassenangaben ergänzte Kennungen
    sind damit nicht gemeint. Das Schema prüft den Aufbau; die Prüfziffernvalidierung ist noch festzulegen.
    Die KVNR belegt weder eine aktuelle Versicherung noch eine Zugriffsberechtigung.

    Eine Suche findet Datensätze, bestätigt aber keine Identität eines Aufrufers oder Anrufers
    und erteilt keinen Auftrag für weitere Aktionen. Auch die Stammdatensuche mit POST liest nur:
    Sie erzeugt weder Personen noch Suchressourcen. Fachliche Rollen und Betreuungshinweise
    beschreiben die Person; sie sind keine Zugriffsrechte oder Nachweise konkreter Vertretungsbefugnisse.

    ## Gemeinsam erweitern
    Gleiche fachliche Begriffe, Kennungen und Beziehungen sollen systemübergreifend dieselbe Bedeutung
    haben. Ergänzungen beschreiben ihre Eingaben, Ergebnisse und Berechtigungsanforderungen im Vertrag
    und folgen denselben Regeln für Zugriffskontext und Datenumfang. Interne Systemnamen und Strukturen
    werden nicht zu fachlichen Ressourcen oder Auswahlparametern. Bestehende Bedeutungen bleiben erhalten.
    Regeln für Namensräume, Versionierung, Kompatibilität und die Übernahme von Erweiterungen sind noch offen.
    Zusätzliche Antwortfelder erlauben weder beliebige Anfragefelder noch ersetzen sie diese Vereinbarungen.

    # Daten- und Antwortkonventionen
    Listen stehen unter data; IDs und fachliche Kennungen sind Zeichenfolgen. Fehlende optionale
    Felder bedeuten „nicht geliefert“, keinen Negativbefund und keine vollständige Datenabdeckung.
    null ist nicht vorgesehen. Clients müssen zusätzliche Antwortfelder tolerieren.
    Beispiele sind erfunden und belegen keine real vergebenen Kennungen.
    Personenbezogene Antworten verwenden Cache-Control: no-store; Fehler enthalten weder
    Suchwerte noch Angaben über nicht zugängliche Personen.
tags:
- name: personen
  description: Natürliche Personen unabhängig von ihren fachlichen Rollen.
- name: kontakte
  description: Dokumentierte Kommunikationsereignisse zu einer Person.
- name: aufgaben
  description: Arbeitsaufträge zu einer Person.
security:
- zugriffsnachweis: []
x-status: Vorschlag zur gemeinsamen Abstimmung
x-offene_entscheidungen:
- Betreuungstypen, Zuordnung betreuender Personen oder Stellen und freigegebener Umfang.
- Adresszuordnung, Gültigkeitsgrenzen und Verwendungszwecke der Kontaktdaten fachlich bestätigen.
- Aufgabendefinitionen, automatische Zuweisung und Mitarbeiterkennungen.
- Vollständiger personenweiter Aufgabenabruf unabhängig von Bearbeiterzuweisungen; tatsächliche Leseberechtigungen gesondert klären.
- Aktuelle Aufgabenbemerkung und Vorgangsnotiz, Textgrenzen sowie Verlustfreiheit der Anlage bestätigen.
- Erweiterungsregeln für Namensräume, Versionierung, Kompatibilität und gemeinsame Übernahme neuer Ressourcen.
- Systemübergreifende Zuordnung von Ressourcenidentitäten und Beziehungen.
- Stabilität der Ressourcen-ID und Verhalten bei Zusammenführung von Personen.
- Vertrauenswürdige Bindung von Anwendung, Mandant und gegebenenfalls Mitarbeiter oder Versichertem.
- Authentisierungs- und Delegationsverfahren sowie Regeln für den jeweils zulässigen Datenumfang.
- Typbezogene Normalisierung und Prüfziffernvalidierung der Identifikatoren.
- Fachlicher Rollenkatalog und dessen zeitliche Aussagekraft.
- Erweiterung der Sucharten und Behandlung historischer Kennungen.
- Gesonderte Nachweise und Regeln für Vertretungsbefugnisse.
- Mindestkombinationen und Vergleichsregeln der Stammdatensuche fachlich bestätigen.
- Umgang mit früheren Namen, historischen Adressen und fehlertoleranter Suche bei konkretem Bedarf.
- Fachliche Abnahme der Kontaktcodes, Zeichenzählung, Zeitzonenabbildung und lesbaren Kontaktfelder.
- Verlässliche Speicherung und Rückgabe der Kennzeichnung maschinell erzeugter Dokumentation.
- Sicherstellung der Personenzuordnung bei Anlage und Verhalten bei nicht eindeutig bestätigter Zuordnung.
- Umsetzung der Idempotenz und fachlichen Ereigniszuordnung einschließlich Bereinigung personenbezogener Inhalte.
- Abnahme der Seitengrenzen und Laufzeit für große Kontaktbestände.
paths:
  /personen:
    get:
      tags:
      - personen
      operationId: personen_suchen
      summary: Personen anhand eines Identifikators suchen
      description: |
        Exakte Suche nach einem fachlichen Identifikator. identifikator_wert ist immer
        erforderlich. Ohne bekannte Kennung ist personen_nach_stammdaten_suchen zu verwenden.
        Eine unbeschränkte Personenliste ist nicht vorgesehen.
        Ist identifikator_art angegeben, wird ausschließlich diese Art geprüft.
        Fehlt die Art, werden alle drei in dieser Version unterstützten Arten geprüft.
        Das Format darf Prüfungen optimieren, aber keinen passenden Identifikator einer
        anderen unterstützten Art stillschweigend ausschließen. Freitext wird nicht
        interpretiert; der Agent muss den möglichen Identifikator zuvor aus dem Text entnehmen.

        Der übergebene Wert wird URL-dekodiert und ansonsten exakt verglichen; keine
        unscharfe Suche, Ergänzung führender Nullen oder stillschweigende Formatkorrektur.
        Weitere typbezogene Normalisierungsregeln sind noch abzustimmen.
        Berücksichtigt werden ausschließlich fachlich aktuell gültige, aktive Kennungen.
        Für lokale Partnernummern gilt der vertrauenswürdig bestimmte Mandantenkontext.

        Treffer werden nach kanonischer Personen-ID zusammengeführt. Trifft derselbe Wert
        für mehrere Arten auf dieselbe Person zu, enthält das Ergebnis einen Treffer mit
        mehreren passenden_identifikator_arten. Verschiedene Personen bleiben getrennte Treffer.
        Es findet keine automatische Auswahl eines vermeintlich wahrscheinlichsten Treffers statt.

        Vor Rückgabe wird der erforderliche Zugriffskontext angewendet. data enthält nur
        zugängliche Personen. auswertung bezieht sich ausschließlich auf diese Ergebnismenge
        und ist kein Nachweis globaler Eindeutigkeit oder einer Anruferidentität.
        Kein zugänglicher Treffer ergibt 200 mit leerem data, unabhängig davon, ob weitere
        nicht zugängliche Personen existieren. Fehlt die Suchberechtigung insgesamt, gilt 403.

        Alle für die Anfrage zu prüfenden Arten müssen vollständig geprüft sein. Ausfälle ergeben 503,
        kein leeres oder scheinbar eindeutiges Teilergebnis. Bis zu 20 zugängliche Personen
        werden vollständig geliefert. Bei mehr Treffern gilt 422 treffermenge_zu_gross;
        es wird nicht abgeschnitten. Diese Grenze ist ein Entwurfsvorschlag.

        Bei identifikator_art=kvnr muss identifikator_wert dem Schema kvnr entsprechen:
        genau ein Großbuchstabe A bis Z und neun Ziffern. Abweichender Zeichenaufbau ergibt 400.
        Ohne angegebene Art wird ein Wert mit abweichendem Aufbau nicht als KVNR gewertet;
        die übrigen unterstützten Arten werden weiterhin geprüft. Die Prüfziffernvalidierung
        ist noch nicht als verbindliches Suchverhalten festgelegt.

        Bei mehrdeutigem Ergebnis darf keine Person automatisch ausgewählt werden. Zusätzliche
        Angaben sind einzuholen oder die Auswahl ist anhand eines bestätigten Kontexts zu klären.
      parameters:
      - name: identifikator_wert
        in: query
        required: true
        description: Exakter Wert einer möglichen Personenkennung. Führende Nullen bleiben erhalten. Bei identifikator_art=kvnr
          gilt der Zeichenaufbau des Schemas kvnr. Die Abhängigkeit zwischen den beiden Abfrageparametern ist zusätzlich
          zur Parameterdefinition zu prüfen.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^\S+$
        example: "000123456789"
      - name: identifikator_art
        in: query
        required: false
        description: Bekannte Art der Kennung. Ohne Angabe werden alle unterstützten Arten geprüft.
        schema:
          $ref: '#/components/schemas/identifikator_art'
      responses:
        "200":
          description: Vollständiges Suchergebnis im zulässigen Zugriffskontext.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/personensuche_ergebnis'
              examples:
                eindeutig:
                  summary: Eine zugängliche Person gefunden
                  value:
                    auswertung: eindeutig
                    data:
                    - id: person-beispiel-001
                      passende_identifikator_arten:
                      - partnernummer
                      name:
                        vorname: Erika
                        nachname: Musterfrau
                kein_treffer:
                  summary: Keine zugängliche Person gefunden
                  value:
                    auswertung: kein_treffer
                    data: []
                mehrdeutig:
                  summary: Ein Suchwert passt zu zwei Personen
                  value:
                    auswertung: mehrdeutig
                    data:
                    - id: person-beispiel-001
                      passende_identifikator_arten:
                      - partnernummer
                    - id: person-beispiel-002
                      passende_identifikator_arten:
                      - partnernummer
                mehrere_arten_eine_person:
                  summary: Mehrere passende Arten bezeichnen dieselbe Person
                  value:
                    auswertung: eindeutig
                    data:
                    - id: person-beispiel-001
                      passende_identifikator_arten:
                      - partnernummer
                      - rvnr
        "400":
          $ref: '#/components/responses/ungueltige_anfrage'
        "401":
          $ref: '#/components/responses/nicht_authentifiziert'
        "403":
          $ref: '#/components/responses/zugriff_abgelehnt'
        "422":
          description: Mehr als 20 zugängliche Personen; Identifikatorart präzisieren oder Datenbestand klären.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fehler'
              example:
                code: treffermenge_zu_gross
                meldung: Die Suche liefert zu viele Treffer. Bitte die Identifikatorart präzisieren.
        "500":
          $ref: '#/components/responses/interner_fehler'
        "503":
          $ref: '#/components/responses/dienst_nicht_verfuegbar'
      x-mcp_annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
  /personen/{person_id}:
    get:
      tags:
      - personen
      operationId: person_lesen
      summary: Stammdaten einer natürlichen Person lesen
      description: |
        Liefert die Person zur kanonischen Ressourcen-ID. An dieser Stelle werden keine
        KVNR, RVNR oder anderen alternativen Kennungen automatisch interpretiert.
        Die ID kann aus einer vorherigen Suche oder einer bestehenden Referenz stammen.

        Nur im jeweiligen Kontext zugängliche Felder werden geliefert. Nicht vorhandene
        oder nicht freigegebene optionale Felder werden weggelassen. Eine nicht zugängliche
        Person ist wie eine unbekannte ID mit 404 zu behandeln. 403 bezeichnet eine fehlende
        grundsätzliche Aufruffreigabe oder einen fehlenden erforderlichen Benutzerkontext.

        Identifikatoren und Rollen sind keine vollständige Akte. Ein fehlendes Rollenfeld
        oder Versicherungskennzeichen erlaubt keine Aussage zum Versicherungsstatus.
        Über den beschriebenen Feldumfang hinausgehende Angaben sind nicht Bestandteil dieser Operation.
      parameters:
      - name: person_id
        in: path
        required: true
        description: Kanonische Ressourcen-ID einer natürlichen Person im API-Mandantenkontext.
        schema:
          $ref: '#/components/schemas/person_id'
      responses:
        "200":
          description: Zugängliche Personenstammdaten.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/person'
              examples:
                stammdaten:
                  summary: Synthetische Personenstammdaten mit Partnernummer
                  value:
                    id: person-beispiel-001
                    geburtsdatum: "1980-05-12"
                    geschlecht: weiblich
                    identifikatoren:
                    - art: partnernummer
                      wert: "000123456789"
                    rollen:
                    - code: versicherter
                      bezeichnung: Versicherte Person
                    name:
                      vorname: Erika
                      nachname: Musterfrau
                minimale_person:
                  summary: Nur die zugängliche Ressourcen-ID ist verfügbar
                  value:
                    id: person-beispiel-002
                interessent_ohne_kvnr:
                  summary: Interessent ohne KVNR und ohne bekanntes Geburtsdatum
                  value:
                    id: person-beispiel-003
                    name:
                      vorname: Alex
                      nachname: Beispiel
                    rollen:
                    - code: interessent
                      bezeichnung: Interessent
                mehrere_rollen:
                  summary: Person mit Namensbestandteilen und mehreren fachlichen Rollen
                  value:
                    id: person-beispiel-004
                    name:
                      vorname: Anna Maria
                      nachname: Beispiel
                      vorsatzwort: von
                      titel: Dr.
                    rollen:
                    - code: versicherter
                      bezeichnung: Versicherte Person
                    - code: pflegeperson
                      bezeichnung: Pflegeperson
        "400":
          $ref: '#/components/responses/ungueltige_anfrage'
        "401":
          $ref: '#/components/responses/nicht_authentifiziert'
        "403":
          $ref: '#/components/responses/zugriff_abgelehnt'
        "404":
          $ref: '#/components/responses/person_nicht_gefunden'
        "500":
          $ref: '#/components/responses/interner_fehler'
        "503":
          $ref: '#/components/responses/dienst_nicht_verfuegbar'
      x-mcp_annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
  /personen/suche:
    post:
      tags:
      - personen
      operationId: personen_nach_stammdaten_suchen
      summary: Personen anhand von Namen, Geburtsdatum und Adresse suchen
      description: |
        Findet Personen anhand bekannter Stammdaten, wenn keine verlässliche fachliche Kennung vorliegt.
        Bei bekannter Ressourcen-ID person_lesen, bei bekannter Kennung personen_suchen verwenden.
        Die Operation nimmt ein strukturiertes Suchobjekt entgegen und verändert keine fachlichen Daten.

        Mindestangaben: Nachname und vollständiges Geburtsdatum ODER Vorname und Nachname sowie
        eine Adresse mit Land und mindestens Postleitzahl oder Ort. Ein Name allein, nur ein Geburtsdatum
        oder eine Adresse ohne Namen reicht nicht aus. Weitere bekannte Angaben sind zur Eingrenzung
        zu übergeben. Unbekannte Angaben weglassen, niemals ergänzen oder erfinden.
        Alle angegebenen Kriterien gelten gemeinsam (UND). Kriterien werden bei ausbleibenden Treffern
        nicht stillschweigend ignoriert. unbekannte Felder und unzureichende Kombinationen ergeben 400
        mit ungueltige_anfrage und parameter_hinweise.

        Vergleichsregeln: Namen, Orts- und Straßenangaben sowie Hausnummern werden nach Unicode-NFC-
        Normalisierung, Umwandlung in Kleinbuchstaben und Vereinheitlichung von Leerraum verglichen:
        Leerraum am Anfang und Ende entfernen und zusammenhängende Unicode-Leerraumzeichen durch
        ein Leerzeichen ersetzen. Danach gilt vollständige Gleichheit, keine Teilwort-, Präfix-, phonetische
        oder unscharfe Suche. Umlaute und ß bleiben erhalten; Mueller ist nicht gleich Müller, ss nicht
        ß. Satzzeichen und Bindestriche bleiben erhalten. Mehrere Vornamen werden als gesamte Angabe
        verglichen. Wildcards haben keine Sonderbedeutung. Geburtsdaten werden als vollständige
        Kalenderdaten verglichen. Postleitzahlen werden wie Text normalisiert; interne Leerzeichen
        bleiben als vereinheitlichte Zwischenräume erhalten. Für DE ist der übergebene Postleitzahlwert
        bereits auf genau fünf Ziffern begrenzt. Ländercodes sind als gültige Großbuchstaben-Codes anzugeben.

        Adresskriterien gelten für eigene, zum Abfragezeitpunkt gültige Melde- und Zustelladressen.
        Alle angegebenen Adressbestandteile müssen in EINER solchen Adresse zusammenpassen, nicht
        über mehrere Adressen verteilt. Historische Adressen und Adressen von Vertretern oder abweichenden
        Empfängern werden nicht für die eigene Anschrift verwendet. Hausnummer setzt Straße voraus.
        Fehlt ein für den Vergleich benötigtes Merkmal, erfüllt die Person das betreffende Kriterium nicht.

        Nur Kriterien, deren Nutzung im Aufrufkontext erlaubt ist, dürfen ausgewertet werden. Ist eine
        angefragte Suchfähigkeit oder ein Suchfeld insgesamt nicht erlaubt, gilt 403; Kriterien dürfen
        nicht ohne Hinweis entfallen. Ergebnisse enthalten ausschließlich zugängliche Personen und Felder.
        Ein unbekannter oder nicht zugänglicher Treffer wird nicht offengelegt. Kein zugänglicher Treffer
        ergibt 200 mit auswertung=kein_treffer und leerem data.

        Treffer werden nach Ressourcen-ID dedupliziert und innerhalb der Antwort nach id aufsteigend
        sortiert. Die Reihenfolge bewertet keine Wahrscheinlichkeit. Bis zu 20 zugängliche Personen werden
        vollständig geliefert. Mehr als 20 ergeben 422 treffermenge_zu_gross ohne Teilmenge; es sind
        zusätzliche bekannte Kriterien einzuholen. Eine unvollständige Suche ergibt 503 und niemals ein
        scheinbar eindeutiges Teilergebnis. Der Vergleich erfolgt ohne angekündigte Bestandsaufnahme;
        Änderungen des Datenbestands können das Ergebnis eines späteren Aufrufs verändern.

        Bei auswertung=mehrdeutig sind weitere Angaben oder eine bestätigte Auswahl nötig. Bei
        kein_treffer sind die bekannten Angaben zu prüfen; es wird keine Person automatisch angelegt.
        Auch auswertung=eindeutig belegt nur einen zugänglichen Treffer, nicht die authentisierte Identität
        oder einen Auftrag für nachfolgende Schreiboperationen. Die Suchregeln sind Entwurfsvorschläge.
      requestBody:
        required: true
        description: Bekannte Suchkriterien; unbekannte Angaben weglassen. Mindestkombinationen sind im Schema festgelegt.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stammdaten_suchkriterien'
            examples:
              name_und_geburtsdatum:
                summary: Nachname und Geburtsdatum, optional mit Vorname
                value:
                  nachname: Musterfrau
                  vorname: Erika
                  geburtsdatum: "1980-05-12"
      responses:
        '200':
          description: Bis zu 20 vollständig ermittelte zugängliche Treffer.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stammdatensuche_ergebnis'
        '400':
          $ref: '#/components/responses/ungueltige_anfrage'
        '401':
          $ref: '#/components/responses/nicht_authentifiziert'
        '403':
          $ref: '#/components/responses/zugriff_abgelehnt'
        '500':
          $ref: '#/components/responses/interner_fehler'
        '503':
          $ref: '#/components/responses/dienst_nicht_verfuegbar'
        '422':
          description: 'treffermenge_zu_gross: Mehr als 20 zugängliche Treffer, keine Teilmenge.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fehler'
              example:
                code: treffermenge_zu_gross
                meldung: Bitte die Suchkriterien eingrenzen.
      x-mcp_annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
  /personen/{person_id}/kontakte:
    parameters:
    - name: person_id
      in: path
      required: true
      description: Ressourcen-ID der Person, deren Kontakte gelesen oder ergänzt werden.
      schema:
        $ref: '#/components/schemas/person_id'
    get:
      tags:
      - kontakte
      operationId: kontakte_lesen
      summary: Kontakte einer Person im Zeitraum abrufen
      description: |
        Liefert die eigenen zugänglichen Kontakte der Person einschließlich archivierter Einträge.
        Kontakte anderer Personen, auch aus einem Familienverbund, sind nicht enthalten.
        Kontakte sind Kommunikationsereignisse, keine Telefonnummern oder E-Mail-Adressen.
        Für alle Filter gilt UND. von ist einschließlich, bis ausschließlich; bis muss nach von
        liegen. RFC-3339-Zeitpunkte mit Zeitzone werden als absolute Zeitpunkte verglichen.
        kanal filtert exakt auf einen freigegebenen fachlichen Code; unterschiedliche Wege wie
        anruf und telefon werden nicht stillschweigend zusammengefasst. Unbekannte Filtercodes
        ergeben 400, keine ungefilterte Antwort. Ohne Kanalfilter werden alle zugänglichen Wege
        geliefert. Kontakte ohne bekannten Kontaktzeitpunkt erfüllen keinen Zeitraumfilter.
        Aus unbekannten Zeiten werden keine Ersatzzeitpunkte erzeugt.

        Die Liste ist nach kontakt_am absteigend und bei gleichem Zeitpunkt nach id aufsteigend
        sortiert. seitengroesse ist höchstens 100, standardmäßig 50. versatz ist die Anzahl der
        zu überspringenden zugänglichen Treffer, standardmäßig 0. Filterung und Berechtigungsprüfung
        erfolgen vor dem Zählen. naechster_versatz wird nur geliefert, wenn weitere zugängliche
        Kontakte folgen; er ist beim Folgeaufruf mit unveränderten Filtern zu verwenden.
        Eine unvollständige Quellantwort darf nicht als letzte Seite ausgegeben werden.

        Jede Anfrage liest den jeweils verfügbaren Stand. Zwischenzeitliche Änderungen können
        beim Weiterblättern zu ausgelassenen oder mehrfach gelieferten Einträgen führen. Für einen
        aktuellen Überblick ist die Abfrage bei versatz=0 neu zu starten. Es gibt keine Zusage
        einer vollständigen historischen Akte; insbesondere fehlen undatierte Kontakte im Zeitfilter.
        Die Seitengrenze begrenzt die API-Antwort, nicht den Aufwand in angebundenen Diensten.

        Eine unbekannte oder nicht zugängliche Person ergibt 404. Fehlende grundsätzliche
        Leseberechtigung oder eine insgesamt nicht erlaubte Filternutzung ergibt 403.
        Personen-, Kontakt- und Feldberechtigungen werden vor jeder Seite neu geprüft.
        Eine Freigabe der Person allein berechtigt nicht zum Zugriff auf jeden Kontakt oder jedes
        Dokument. Kontaktbezogene Schutzstufen und fachliche Einschränkungen einzelner Felder
        müssen berücksichtigt werden. Optionale unbekannte oder nicht freigegebene Felder fehlen.
        Ohne zugängliche Treffer gilt 200 mit leerem data und ohne naechster_versatz.
        Bei einer ausgefallenen erforderlichen Daten- oder Berechtigungsprüfung gilt 503.
      parameters:
      - name: von
        in: query
        required: true
        description: Einschließlicher Beginn des Kontaktzeitraums mit Zeitzone.
        schema:
          type: string
          format: date-time
        example: '2026-10-01T00:00:00+02:00'
      - name: bis
        in: query
        required: true
        description: Ausschließlicher Endzeitpunkt; muss nach von liegen.
        schema:
          type: string
          format: date-time
        example: '2026-11-01T00:00:00+01:00'
      - name: kanal
        in: query
        required: false
        description: Exakter Kommunikationskanal; keine Filterung bei fehlendem Parameter.
        schema:
          $ref: '#/components/schemas/kontaktkanal'
      - name: seitengroesse
        in: query
        required: false
        description: Maximale Anzahl zugänglicher Kontakte pro Seite.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: versatz
        in: query
        required: false
        description: Anzahl zu überspringender zugänglicher Kontakte nach Filterung und Sortierung.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Eine Seite zugänglicher Kontakte im angefragten Zeitraum.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kontaktliste'
              examples:
                letzte_seite:
                  value:
                    data:
                    - id: kontakt-beispiel-001
                      kontakt_am: '2026-10-20T10:15:00+02:00'
                      kanal: chat
                      richtung: eingehend
                      status: erledigt
                      betreff: Rückfrage zum Bearbeitungsstand
                      bemerkung: Der aktuelle Bearbeitungsstand wurde erläutert.
                      maschinell_erzeugt: true
                      externe_id: kundenportal:gespraech-beispiel-001
                weitere_seite:
                  value:
                    data:
                    - id: kontakt-beispiel-002
                      kontakt_am: '2026-10-21T08:00:00Z'
                      kanal: telefon
                    naechster_versatz: 1
                keine_kontakte:
                  value:
                    data: []
        '400':
          description: Ungültiger Zeitraum, Parameter oder Filtercode; keine ungefilterte Ersatzabfrage.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fehler'
              examples:
                zeitraum_ungueltig:
                  value:
                    code: ungueltige_anfrage
                    meldung: Das Ende des Zeitraums muss nach dem Beginn liegen.
        '401':
          $ref: '#/components/responses/nicht_authentifiziert'
        '403':
          $ref: '#/components/responses/zugriff_abgelehnt'
        '404':
          $ref: '#/components/responses/person_nicht_gefunden'
        '500':
          $ref: '#/components/responses/interner_fehler'
        '503':
          $ref: '#/components/responses/dienst_nicht_verfuegbar'
      x-mcp_annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
    post:
      tags:
      - kontakte
      operationId: kontakt_anlegen
      summary: Ein Kommunikationsereignis zur Person dokumentieren
      description: |
        Dokumentiert genau ein Kommunikationsereignis für die Person. Versendet keine Nachricht
        und ändert keine Personenstammdaten. Eine erfolgreiche Personensuche ist kein Auftrag zur
        Dokumentation. Vor dem Aufruf muss ein ausdrücklicher fachlicher Auftrag vorliegen.
        Unbekannte Inhalte dürfen nicht erfunden werden. Unbekannte Felder, fehlende Pflichtangaben,
        ungültige Werte und überschrittene Textlängen ergeben 400; Texte werden nicht abgeschnitten.
        status ist ausdrücklich mit erledigt, in_bearbeitung oder storniert anzugeben.
        Der Status beschreibt die Kontaktdokumentation, nicht den Abschluss eines Leistungsanliegens.
        id und person_id sind keine Eingabefelder. Fehlende fachliche Codes werden nicht erraten.
        Ein syntaktisch gültiger, aber nicht unterstützter Kanal ergibt 422 kontakt_nicht_abbildbar.
        Eine abgeschlossene Zusammenfassung kann als erledigt dokumentiert werden.
        maschinell_erzeugt beschreibt die Entstehung des Textes, nicht den Kanal oder Bearbeitungsstatus.
        Dieser Wert muss verlässlich erhalten bleiben; ist das nicht möglich, wird die Anlage abgelehnt.
        Vorhandene Textgrenzen dürfen durch Zeichensatzkonvertierung nicht zu stillem Datenverlust führen.

        Die Operation erfordert die Berechtigung zum Anlegen für Person, Kanal und Inhalte.
        Eine unbekannte oder nicht zugängliche Person ergibt 404; fehlende grundsätzliche
        Schreibberechtigung ergibt 403. Die Anlagebestätigung ist Teil der Schreibberechtigung,
        berechtigt aber nicht zum Listenabruf. Sie enthält keine Gesprächsinhalte.
        Vor dem Schreiben müssen Existenz, eindeutige Zuordnung und Berechtigung der Person
        feststehen. 201 bestätigt nur einen dauerhaft angelegten, genau dieser Person zugeordneten
        Kontakt. Eine Anlage ohne bestätigte Personenzuordnung erfüllt den Vertrag nicht und darf
        nicht als Erfolg ausgegeben werden. Ist der Ausgang nach einem Schreibversuch unklar,
        gilt 503 mit weiterhin gesperrtem Auftrag; es darf nicht blind erneut angelegt werden.
        200 bedeutet, dass eine identische
        externe Referenz bereits dokumentiert war. Bei 400, 403, 404 und 422 wird kein neuer
        Schreibauftrag begonnen. 500 oder 503 sind kein Beleg dafür, dass nichts angelegt wurde.

        externe_id identifiziert zusätzlich das fachliche Ereignis und ist für maschinell erzeugte
        Inhalte verpflichtend. Sie ist höchstens 64 Zeichen lang und wird unverändert gespeichert.
        Vor Freigabe einer Anwendung wird ihr zulässiger Wertebereich vereinbart; beispielsweise
        kann ein Herkunftspräfix enthalten sein. Die Anwendung darf keine fremden Referenzen verwenden.
        Innerhalb eines Mandanten bezeichnet die externe_id ein Ereignis, unabhängig von Auftrag
        und person_id. Die API muss die Eindeutigkeit selbst sicherstellen; ein vorhandenes Feld
        für externe Kennungen allein ist kein Nachweis einer Dublettenprüfung.
        Ein bereits zugeordnetes Ereignis mit identischer Person und identischen Eingaben ergibt
        200 mit der bestehenden Kontakt-ID, auch bei einem neuen Idempotency-Key. Abweichende
        Person oder Eingaben ergeben 409 externe_referenz_konflikt, ohne fremde Daten offenzulegen.
        Bei bereits mehrdeutig belegter Referenz darf keine weitere Anlage oder automatische Auswahl
        erfolgen. Die fachliche Ereigniszuordnung bleibt unabhängig vom technischen Wiederholungsauftrag verbindlich.
        Kann sie nicht mehr sicher aufgelöst werden, wird die Anlage mit 409 abgelehnt.
        Ohne externe_id verhindert nur derselbe Idempotency-Key doppelte Aufträge.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Schlüssel zur Vermeidung doppelter Schreibwirkungen bei Wiederholungen.
        schema:
          $ref: '#/components/schemas/idempotenzschluessel'
        example: '06a37d58-d26f-4ee6-9b26-41ff8bea57a1'
      requestBody:
        required: true
        description: Fachliche Angaben zum dokumentierten Kommunikationsereignis.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kontakt_anlage'
            examples:
              maschinelle_zusammenfassung:
                value:
                  kontakt_am: '2026-10-20T10:15:00+02:00'
                  kanal: chat
                  status: erledigt
                  richtung: eingehend
                  betreff: Rückfrage zum Bearbeitungsstand
                  bemerkung: Der aktuelle Bearbeitungsstand wurde erläutert.
                  maschinell_erzeugt: true
                  externe_id: kundenportal:gespraech-beispiel-001
              manuelle_dokumentation:
                value:
                  kontakt_am: '2026-10-20T09:00:00Z'
                  kanal: telefon
                  status: erledigt
                  betreff: Rückruf
                  bemerkung: Das Anliegen wurde telefonisch besprochen.
                  maschinell_erzeugt: false
      responses:
        '201':
          description: Kontakt dauerhaft angelegt. Eine Wiederholung desselben Schlüssels liefert diesen Status erneut.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kontakt_annahme'
              example:
                id: kontakt-beispiel-001
                person_id: person-beispiel-001
        '200':
          description: Identisches Ereignis unter der externen Referenz bereits vorhanden; kein neuer Kontakt angelegt.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kontakt_annahme'
              example:
                id: kontakt-beispiel-001
                person_id: person-beispiel-001
        '400':
          $ref: '#/components/responses/ungueltige_anfrage'
        '401':
          $ref: '#/components/responses/nicht_authentifiziert'
        '403':
          $ref: '#/components/responses/zugriff_abgelehnt'
        '404':
          $ref: '#/components/responses/person_nicht_gefunden'
        '409':
          description: Auftrag läuft oder Eingaben stehen im Konflikt.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
            Retry-After:
              description: Bei auftrag_in_bearbeitung vorhanden; frühester erneuter Versuch in Sekunden mit demselben Schlüssel.
              schema:
                type: integer
                minimum: 1
              example: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fehler'
              examples:
                abweichender_auftrag:
                  value:
                    code: idempotenzkonflikt
                    meldung: Der Schlüssel gehört zu einem anderen Auftrag.
                laufender_auftrag:
                  value:
                    code: auftrag_in_bearbeitung
                    meldung: Bitte denselben Auftrag nach der angegebenen Wartezeit wiederholen.
                externe_referenz_belegt:
                  value:
                    code: externe_referenz_konflikt
                    meldung: Die externe Referenz kann diesem Auftrag nicht zugeordnet werden.
        '422':
          description: Fachlich zulässige Eingaben können vom Dienst nicht verlustfrei dokumentiert werden; keine Anlage.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fehler'
              example:
                code: kontakt_nicht_abbildbar
                meldung: Die übergebenen Kontaktangaben können nicht vollständig dokumentiert werden.
        '500':
          $ref: '#/components/responses/interner_fehler'
        '503':
          description: Verarbeitung oder sichere Ergebnisermittlung vorübergehend nicht möglich. Nur mit demselben Schlüssel wiederholen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/keine_speicherung'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fehler'
              example:
                code: dienst_nicht_verfuegbar
                meldung: Der Auftrag kann derzeit nicht sicher abgeschlossen werden. Bitte denselben Schlüssel beibehalten.
      x-mcp_annotations:
        readOnlyHint: false
        destructiveHint: false
        idempotentHint: true
