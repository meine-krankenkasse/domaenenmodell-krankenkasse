name: API-Dokumentation veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Werkzeuge installieren
        run: npm ci --ignore-scripts
      - name: Gesamtdatei erzeugen
        run: npm run bundle
      - name: Quellen und Gesamtvertrag prüfen
        run: npm test
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - name: Dokumentation zusammenstellen
        run: |
          mkdir -p _site
          cp docs/index.html build/openapi.yaml _site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
