openapi: "3.1.0"
info:
  title: Domänenmodell Krankenkasse
  license:
    name: Zero-Clause BSD
    identifier: 0BSD
  version: "0.12.0-entwurf"
  summary: Personen identifizieren, Stammdaten und Kontoinformationen lesen sowie Kontakte und Aufgaben nutzen
  description: |
    Ein gemeinsames fachliches Modell mit REST-Vertrag für Krankenkassen, unabhängig von den angebundenen Systemen. Dieser Entwurf dient der fachlichen Abstimmung.

    Der Umfang umfasst Personensuche, Stammdaten, Adressen, Kontaktdaten, Zahlungskonten und Kontobewegungen sowie das Lesen und Anlegen von Kontakten und Aufgaben.

    Anwendungen können eigenständig, im Auftrag eines Mitarbeiters oder für einen Versicherten handeln. Die technische Absicherung wird später festgelegt.

    Listen stehen unter data. Kennungen sind Zeichenfolgen. Fehlende optionale Felder bedeuten „nicht geliefert“; null ist nicht vorgesehen. Clients tolerieren zusätzliche Antwortfelder. Beispiele sind erfunden.
tags:
  - name: personen
    description: Natürliche Personen unabhängig von ihren fachlichen Rollen.
