parameters:
  - name: person_id
    in: path
    required: true
    description: Ressourcen-ID der Person.
    schema:
      $ref: '../../schemas/personen.yaml#/person_id'
get:
  tags:
    - personen
  operationId: kontaktdaten_lesen
  summary: Aktuelle Telefonnummern und E-Mail-Adressen lesen
  description: "Liefert aktuelle eigene Telefon-, Mobil- und E-Mail-Kontaktdaten. Unvollständige Abrufe ergeben 503."
  responses:
    '200':
      description: Zugängliche Daten im beschriebenen Umfang.
      content:
        application/json:
          schema:
            $ref: '../../schemas/kontaktdaten.yaml#/kontaktdatenliste'
    '400':
      $ref: '../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    '404':
      $ref: '../../antworten/fehlerantworten.yaml#/person_nicht_gefunden'
    '500':
      $ref: '../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
