parameters:
  - name: person_id
    in: path
    required: true
    description: Ressourcen-ID der Person.
    schema:
      $ref: '../../schemas/personen/person_id.yaml'
get:
  tags:
    - personen
  operationId: kontaktdaten_lesen
  summary: Aktuelle Telefonnummern und E-Mail-Adressen lesen
  description: |
    Liefert eigene Telefon-, Mobil- und E-Mail-Kontaktdaten, die am Abrufdatum in Europe/Berlin gültig sind. Gültigkeitsgrenzen zählen einschließlich. Historische Einträge und Kommunikationsereignisse sind nicht enthalten.

    Die Liste ist vollständig und nach id aufsteigend sortiert. Ein unvollständiger Abruf ergibt 503. Fehlende Telefonvorwahlen werden nicht ergänzt.
  responses:
    '200':
      description: Zugängliche Daten im beschriebenen Umfang.
      content:
        application/json:
          schema:
            $ref: '../../schemas/personen/kontaktdatenliste.yaml'
    '400':
      $ref: '../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    '404':
      $ref: '../../antworten/fehlerantworten.yaml#/person_nicht_gefunden'
    '500':
      $ref: '../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
