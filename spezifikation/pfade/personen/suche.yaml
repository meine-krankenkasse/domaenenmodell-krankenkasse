post:
  tags:
    - personen
  operationId: personen_nach_stammdaten_suchen
  summary: Personen anhand von Namen, Geburtsdatum und Adresse suchen
  description: |
    Sucht Personen anhand bekannter Stammdaten und verändert keine Daten. Erforderlich sind Nachname und Geburtsdatum oder Vorname, Nachname und eine Adresse mit Land sowie Postleitzahl oder Ort. Alle Angaben gelten gemeinsam; unbekannte Felder oder unzureichende Kriterien ergeben 400.

    Textvergleich: Unicode-Normalisierung NFC, Kleinschreibung, äußeren Leerraum entfernen und zusammenhängenden Leerraum vereinheitlichen. Danach gilt vollständige Gleichheit; Umlaute, ß, Satzzeichen und Bindestriche bleiben erhalten. Mehrere Vornamen werden zusammen verglichen. Geburtsdaten werden als vollständige Kalenderdaten verglichen. Die Postleitzahl wird als Text behandelt; Ländercodes bleiben Großbuchstaben.

    Adresskriterien müssen gemeinsam eine eigene, aktuell gültige Melde- oder Zustelladresse erfüllen. Fehlt ein benötigtes Merkmal, erfüllt die Person das Kriterium nicht.

    Treffer werden nach id zusammengeführt und aufsteigend sortiert. Bis zu 20 Personen werden vollständig geliefert; mehr Treffer ergeben 422 treffermenge_zu_gross, eine unvollständige Suche 503. Ohne Treffer gilt 200 mit leerem data. Mehrdeutigkeit erfordert weitere Angaben oder eine bestätigte Auswahl. Ein Treffer ist kein Identitätsnachweis oder Schreibauftrag.
  requestBody:
    required: true
    description: Bekannte Suchkriterien; unbekannte Angaben weglassen. Mindestkombinationen sind im Schema festgelegt.
    content:
      application/json:
        schema:
          $ref: '../../schemas/personen/stammdaten_suchkriterien.yaml'
        examples:
          name_und_geburtsdatum:
            summary: Nachname und Geburtsdatum, optional mit Vorname
            value:
              nachname: Musterfrau
              vorname: Erika
              geburtsdatum: "1980-05-12"
  responses:
    '200':
      description: Bis zu 20 vollständig ermittelte zugängliche Treffer.
      content:
        application/json:
          schema:
            $ref: '../../schemas/personen/stammdatensuche_ergebnis.yaml'
    '400':
      $ref: '../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    '500':
      $ref: '../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
    '422':
      description: 'treffermenge_zu_gross: Mehr als 20 zugängliche Treffer, keine Teilmenge.'
      content:
        application/json:
          schema:
            $ref: '../../schemas/gemeinsam/fehler.yaml'
          example:
            code: treffermenge_zu_gross
            meldung: Bitte die Suchkriterien eingrenzen.
