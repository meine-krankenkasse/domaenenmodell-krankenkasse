parameters:
  - name: person_id
    in: path
    required: true
    description: Ressourcen-ID der Person.
    schema:
      $ref: '../../../schemas/personen/person_id.yaml'
  - name: zahlungskonto_id
    in: path
    required: true
    description: Ressourcen-ID eines eigenen Zahlungskontos der Person, keine Kontonummer.
    schema:
      $ref: '../../../schemas/gemeinsam/ressourcen_id.yaml'
get:
  tags:
    - personen
  operationId: kontobewegungen_lesen
  summary: Kontobewegungen eines Zahlungskontos im Zeitraum lesen
  description: "Liefert Kontobewegungen mit Positionen im Belegzeitraum, auch ausgeglichene, statistische, stornierte, Korrektur- und Umbuchungen. Person und Konto müssen zusammengehören, sonst 404. Unvollständige Zeiträume oder Abrufe ergeben 503."
  parameters:
    - name: von
      in: query
      required: true
      description: Einschließlich dieses Belegdatums.
      schema:
        type: string
        format: date
      example: '2026-10-01'
    - name: bis
      in: query
      required: true
      description: Ausschließlich dieses Belegdatums; muss nach von liegen, sonst 400.
      schema:
        type: string
        format: date
      example: '2026-11-01'
    - name: seitengroesse
      in: query
      required: false
      description: Maximale Anzahl zugänglicher Bewegungen pro Seite, jeweils mit ihren zugänglichen Positionen.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: versatz
      in: query
      required: false
      description: Anzahl der zu überspringenden zugänglichen Bewegungen nach Anwendung des Zeitfilters.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    '200':
      description: Seite zugänglicher Bewegungen mit vollständigen zugänglichen Positionslisten.
      content:
        application/json:
          schema:
            $ref: '../../../schemas/zahlungskonten/kontobewegungsliste.yaml'
          examples:
            beitrag_mit_zwei_positionen:
              summary: Eine Beitragsbuchung für zwei Monate, teilweise ausgeglichen
              value:
                data:
                  - id: kontobewegung-beispiel-001
                    belegnummer: '000001234567'
                    belegdatum: '2026-10-01'
                    bezeichnung: Beiträge
                    betrag: '250.00'
                    buchungsseite: soll
                    waehrung: EUR
                    offener_betrag: '125.00'
                    ausgleichsstatus: teilweise_ausgeglichen
                    storniert: false
                    faellig_am: '2026-10-15'
                    positionen:
                      - id: position-beispiel-001
                        betrag: '125.00'
                        buchungsseite: soll
                        bezeichnung: Krankenversicherungsbeitrag
                        bezugszeitraum_von: '2026-09-01'
                        bezugszeitraum_bis: '2026-09-30'
                        faellig_am: '2026-10-15'
                      - id: position-beispiel-002
                        betrag: '125.00'
                        buchungsseite: soll
                        bezeichnung: Krankenversicherungsbeitrag
                        bezugszeitraum_von: '2026-10-01'
                        bezugszeitraum_bis: '2026-10-31'
                        faellig_am: '2026-10-15'
                naechster_versatz: 1
            zahlung:
              summary: Ein ausgeglichener Zahlungseingang
              value:
                data:
                  - id: kontobewegung-beispiel-002
                    belegnummer: '000001234568'
                    belegdatum: '2026-10-10'
                    bezeichnung: Überweisungsgutschrift
                    betrag: '125.00'
                    buchungsseite: haben
                    waehrung: EUR
                    offener_betrag: '0.00'
                    ausgleichsstatus: ausgeglichen
                    storniert: false
                    schwebend: false
                    wertstellung_am: '2026-10-10'
                    kontoauszugsdatum: '2026-10-12'
                    positionen:
                      - id: position-beispiel-003
                        betrag: '125.00'
                        buchungsseite: haben
            keine_bewegungen:
              summary: Keine zugänglichen Bewegungen im angefragten Zeitraum
              value:
                data: []
    '400':
      $ref: '../../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    '404':
      $ref: '../../../antworten/fehlerantworten.yaml#/zahlungskonto_nicht_gefunden'
    '500':
      $ref: '../../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
