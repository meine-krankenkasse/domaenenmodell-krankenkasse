parameters:
  - name: person_id
    in: path
    required: true
    description: Ressourcen-ID der Person.
    schema:
      $ref: '../../../schemas/personen.yaml#/person_id'
  - name: zahlungskonto_id
    in: path
    required: true
    description: Kennung eines eigenen Zahlungskontos der Person, keine Kontonummer.
    schema:
      $ref: '../../../schemas/zahlungskonten.yaml#/zahlungskonto_id'
get:
  tags:
    - personen
  operationId: kontobewegungen_lesen
  summary: Kontobewegungen eines Zahlungskontos im Zeitraum lesen
  description: "Liefert die Kontobewegungen im Buchungszeitraum seitenweise, die neueste zuerst. Person und Konto müssen zusammengehören, sonst 404. Unvollständige Zeiträume oder Abrufe ergeben 503."
  parameters:
    - name: von
      in: query
      required: true
      description: Erstes Buchungsdatum des Zeitraums, einschließlich.
      schema:
        type: string
        format: date
      example: '2026-10-01'
    - name: bis
      in: query
      required: true
      description: Letztes Buchungsdatum des Zeitraums, einschließlich; darf nicht vor von liegen, sonst 400.
      schema:
        type: string
        format: date
      example: '2026-10-31'
    - name: seitengroesse
      in: query
      required: false
      description: Maximale Anzahl zugänglicher Kontobewegungen pro Seite.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: versatz
      in: query
      required: false
      description: Anzahl der zu überspringenden Kontobewegungen nach Filterung und Sortierung. Ein Versatz ab
        gesamtanzahl ergibt eine leere Seite.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    '200':
      description: Eine Seite zugänglicher Kontobewegungen im Zeitraum mit der Gesamtanzahl.
      content:
        application/json:
          schema:
            $ref: '../../../schemas/kontobewegungen.yaml#/kontobewegungsliste'
          examples:
            zahlung_und_beitrag:
              summary: Ein Zahlungseingang gleicht eine Beitragsforderung aus
              value:
                gesamtanzahl: 2
                data:
                  - nummer: 0
                    id: buchung-beispiel-002
                    buchungsdatum: '2026-10-10'
                    betrag: '125.00'
                    saldo_nach_buchung: '0.00'
                    buchungsart: zahlungseingang
                    ausgeglichene_posten:
                      - buchung_id: buchung-beispiel-001
                  - nummer: 1
                    id: buchung-beispiel-001
                    buchungsdatum: '2026-10-01'
                    betrag: '-125.00'
                    saldo_nach_buchung: '-125.00'
                    buchungsart: beitrag
            zweite_seite:
              summary: Zweite Seite mit seitengroesse 2 und versatz 2
              value:
                gesamtanzahl: 3
                data:
                  - nummer: 2
                    id: buchung-beispiel-003
                    buchungsdatum: '2026-10-01'
                    betrag: '-5.00'
                    saldo_nach_buchung: '-5.00'
                    buchungsart: mahngebuehr
            keine_bewegungen:
              summary: Keine zugänglichen Kontobewegungen im Zeitraum
              value:
                gesamtanzahl: 0
                data: []
    '400':
      description: Zeitraum oder Seitenparameter fehlen oder sind ungültig; keine ungefilterte Ersatzabfrage.
      content:
        application/json:
          schema:
            $ref: '../../../schemas/gemeinsam.yaml#/fehler'
          examples:
            zeitraum_ungueltig:
              summary: bis liegt vor von
              value:
                code: ungueltige_anfrage
                meldung: Das Ende des Zeitraums darf nicht vor dem Beginn liegen.
                parameter_hinweise:
                  - parameter: bis
                    grund: zeitraum_ungueltig
            seitengroesse_ungueltig:
              summary: seitengroesse außerhalb des zulässigen Bereichs
              value:
                code: ungueltige_anfrage
                meldung: Bitte die angegebenen Parameter prüfen.
                parameter_hinweise:
                  - parameter: seitengroesse
                    grund: format_ungueltig
    '404':
      $ref: '../../../antworten/fehlerantworten.yaml#/zahlungskonto_nicht_gefunden'
    '500':
      $ref: '../../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
