get:
  tags:
    - personen
  operationId: person_lesen
  summary: Stammdaten einer natürlichen Person lesen
  description: |
    Liefert Stammdaten zur Ressourcen-ID der Person. Andere Nummern werden an diesem Pfad nicht als Ressourcen-ID interpretiert. Eine unbekannte Person ergibt 404. Fachliche Rollen belegen allein kein aktuelles Versicherungsverhältnis.
  parameters:
    - name: person_id
      in: path
      required: true
      description: Kanonische Ressourcen-ID einer natürlichen Person im API-Mandantenkontext.
      schema:
        $ref: '../../schemas/personen/person_id.yaml'
  responses:
    "200":
      description: Zugängliche Personenstammdaten.
      content:
        application/json:
          schema:
            $ref: '../../schemas/personen/person.yaml'
          examples:
            stammdaten:
              summary: Synthetische Personenstammdaten mit Partnernummer
              value:
                id: person-beispiel-001
                geburtsdatum: "1980-05-12"
                geschlecht: weiblich
                identifikatoren:
                  - art: partnernummer
                    wert: "000123456789"
                rollen:
                  - code: versicherter
                    bezeichnung: Versicherte Person
                name:
                  vorname: Erika
                  nachname: Musterfrau
            minimale_person:
              summary: Nur die zugängliche Ressourcen-ID ist verfügbar
              value:
                id: person-beispiel-002
            mehrere_rollen:
              summary: Person mit Namensbestandteilen und mehreren fachlichen Rollen
              value:
                id: person-beispiel-004
                name:
                  vorname: Anna Maria
                  nachname: Beispiel
                  vorsatzwort: von
                  titel: Dr.
                rollen:
                  - code: versicherter
                    bezeichnung: Versicherte Person
                  - code: pflegeperson
                    bezeichnung: Pflegeperson
            interessent_ohne_krankenversicherungsnummer:
              summary: Interessent ohne Krankenversicherungsnummer und ohne bekanntes Geburtsdatum
              value:
                id: person-beispiel-003
                name:
                  vorname: Alex
                  nachname: Beispiel
                rollen:
                  - code: interessent
                    bezeichnung: Interessent
    "400":
      $ref: '../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    "404":
      $ref: '../../antworten/fehlerantworten.yaml#/person_nicht_gefunden'
    "500":
      $ref: '../../antworten/fehlerantworten.yaml#/interner_fehler'
    "503":
      $ref: '../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
