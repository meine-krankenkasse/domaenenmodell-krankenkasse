parameters:
  - name: person_id
    in: path
    required: true
    description: Ressourcen-ID der Person.
    schema:
      $ref: '../../schemas/personen/person_id.yaml'
get:
  tags:
    - personen
  operationId: adressen_lesen
  summary: Aktuelle Melde- und Zustelladressen einer Person lesen
  description: |
    Liefert eigene Melde- und Zustelladressen, die am Abrufdatum in Europe/Berlin gültig sind. Gültigkeitsgrenzen zählen einschließlich. Adressen anderer Personen und historische Einträge sind nicht enthalten.

    Die Liste ist vollständig und nach id aufsteigend sortiert; getrennte Zuordnungen bleiben auch bei gleicher Anschrift erhalten. Ein unvollständiger Abruf ergibt 503. Die Angaben bestimmen keine verbindliche Versandadresse.
  responses:
    '200':
      description: Zugängliche Daten im beschriebenen Umfang.
      content:
        application/json:
          schema:
            $ref: '../../schemas/personen/adressliste.yaml'
    '400':
      $ref: '../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    '404':
      $ref: '../../antworten/fehlerantworten.yaml#/person_nicht_gefunden'
    '500':
      $ref: '../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
