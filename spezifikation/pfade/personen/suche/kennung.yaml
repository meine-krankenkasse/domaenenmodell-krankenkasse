post:
  tags:
    - personen
  operationId: personen_nach_kennung_suchen
  summary: Personen anhand einer kvnr, rvnr oder partnernummer suchen
  description: "Sucht Personen anhand einer aktuell gültigen kvnr oder rvnr, ohne Daten zu verändern. Die Suche mit partnernummer ist veraltet und nur für bestehende Abläufe vorgesehen. Die Kennung steht im Anfrageinhalt, damit sie nicht in URLs und Protokollen erscheint. Verglichen wird exakt, ohne Freitextinterpretation. Werte, die keinem Format einer suchbaren Art entsprechen, sowie fehlende oder gleichzeitige Angaben von identifikator_wert und partnernummer ergeben 400; unvollständige Suchen 503."
  requestBody:
    required: true
    description: Gesuchte Kennung; bei kvnr und rvnr ergibt sich die Art aus dem Format.
    content:
      application/json:
        schema:
          $ref: '../../../schemas/personensuche.yaml#/kennung_suchkriterien'
        examples:
          kvnr:
            summary: Suche nach einer kvnr
            value:
              identifikator_wert: A123456789
          partnernummer_veraltet:
            summary: Veraltete Suche nach einer partnernummer
            value:
              partnernummer: "000123456789"
  responses:
    "200":
      description: Vollständiges Suchergebnis mit höchstens einer zugänglichen Person.
      content:
        application/json:
          schema:
            $ref: '../../../schemas/personensuche.yaml#/personensuche_ergebnis'
          examples:
            eindeutig:
              summary: Eine zugängliche Person gefunden
              value:
                auswertung: eindeutig
                data:
                  - id: person-beispiel-001
                    name:
                      vorname: Erika
                      nachname: Musterfrau
            kein_treffer:
              summary: Keine zugängliche Person gefunden
              value:
                auswertung: kein_treffer
                data: []
    "400":
      $ref: '../../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    "500":
      $ref: '../../../antworten/fehlerantworten.yaml#/interner_fehler'
    "503":
      $ref: '../../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
