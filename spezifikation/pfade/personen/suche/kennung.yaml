post:
  tags:
    - personen
  operationId: personen_nach_kennung_suchen
  summary: Personen anhand einer kvnr oder rvnr suchen
  description: "Sucht Personen anhand einer aktuell gültigen kvnr oder rvnr, ohne Daten zu verändern. Die Kennung steht im Anfrageinhalt, damit sie nicht in URLs und Protokollen erscheint. Verglichen wird exakt, ohne Freitextinterpretation. Werte, die keinem Format einer suchbaren Art entsprechen, ergeben 400; unvollständige Suchen 503."
  requestBody:
    required: true
    description: Gesuchte Kennung; die Art ist optional, da sie sich aus dem Format ergibt.
    content:
      application/json:
        schema:
          $ref: '../../../schemas/personensuche.yaml#/kennung_suchkriterien'
        examples:
          kvnr:
            summary: Suche nach einer kvnr
            value:
              identifikator_wert: A123456789
              identifikator_art: kvnr
  responses:
    "200":
      description: Vollständiges Suchergebnis mit höchstens einer zugänglichen Person.
      content:
        application/json:
          schema:
            $ref: '../../../schemas/personensuche.yaml#/personensuche_ergebnis'
          examples:
            eindeutig:
              summary: Eine zugängliche Person gefunden
              value:
                auswertung: eindeutig
                data:
                  - id: person-beispiel-001
                    name:
                      vorname: Erika
                      nachname: Musterfrau
            kein_treffer:
              summary: Keine zugängliche Person gefunden
              value:
                auswertung: kein_treffer
                data: []
    "400":
      $ref: '../../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    "500":
      $ref: '../../../antworten/fehlerantworten.yaml#/interner_fehler'
    "503":
      $ref: '../../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
