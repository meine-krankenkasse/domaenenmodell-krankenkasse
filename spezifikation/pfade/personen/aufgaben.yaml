parameters:
  - name: person_id
    in: path
    required: true
    description: Ressourcen-ID der Person.
    schema:
      $ref: '../../schemas/personen.yaml#/person_id'
get:
  tags:
    - personen
  operationId: aufgaben_lesen
  summary: Aufgaben einer Person unabhängig vom Bearbeiter lesen
  description: "Liefert Aufgaben der Person über alle Bearbeiter und Statuswerte, einschließlich unzugewiesener Aufgaben. Unvollständige Abrufe ergeben 503."
  responses:
    '200':
      description: Zugängliche Daten im beschriebenen Umfang.
      content:
        application/json:
          schema:
            $ref: '../../schemas/aufgaben.yaml#/aufgabenliste'
    '400':
      $ref: '../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    '404':
      $ref: '../../antworten/fehlerantworten.yaml#/person_nicht_gefunden'
    '500':
      $ref: '../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
  parameters:
    - name: seitengroesse
      in: query
      description: Maximale Anzahl zugänglicher Aufgaben pro Seite.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: versatz
      in: query
      description: Anzahl zu überspringender zugänglicher Aufgaben nach Sortierung.
      schema:
        type: integer
        minimum: 0
        default: 0
post:
  tags:
    - personen
  operationId: aufgabe_anlegen
  summary: Eine Aufgabe zur Person anlegen
  description: "Legt eine Aufgabe mit bestätigter Personenzuordnung anhand einer freigegebenen Aufgabendefinition an. Idempotency-Key ist Pflicht; ein neuer Schlüssel kann eine weitere Aufgabe erzeugen, ohne inhaltsbasierte Dublettenprüfung. Bei unklarem Ausgang gilt 503 und der Auftrag bleibt bis zur Klärung gesperrt; 500 und 503 belegen keine Wirkungslosigkeit."
  parameters:
    - $ref: ../../parameter/idempotenzschluessel.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/aufgaben.yaml#/aufgabe_anlage'
  responses:
    '201':
      description: Aufgabe dauerhaft angelegt und der Person zugeordnet.
      content:
        application/json:
          schema:
            $ref: '../../schemas/aufgaben.yaml#/aufgabe_annahme'
    '400':
      $ref: '../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    '404':
      $ref: '../../antworten/fehlerantworten.yaml#/person_nicht_gefunden'
    '500':
      $ref: '../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
    '409':
      description: Auftrag läuft oder Eingaben stehen im Konflikt.
      headers:
        Retry-After:
          description: Bei auftrag_in_bearbeitung vorhanden; frühester erneuter Versuch in Sekunden mit demselben
            Schlüssel.
          schema:
            type: integer
            minimum: 1
          example: 5
      content:
        application/json:
          schema:
            $ref: '../../schemas/gemeinsam.yaml#/fehler'
          examples:
            abweichender_auftrag:
              value:
                code: idempotenzkonflikt
                meldung: Der Schlüssel gehört zu einem anderen Auftrag.
            laufender_auftrag:
              value:
                code: auftrag_in_bearbeitung
                meldung: Bitte denselben Auftrag nach der angegebenen Wartezeit wiederholen.
    '422':
      description: 'aufgabe_nicht_abbildbar: Definition oder Eingabe fachlich nicht umsetzbar; keine Anlage.'
      content:
        application/json:
          schema:
            $ref: '../../schemas/gemeinsam.yaml#/fehler'
