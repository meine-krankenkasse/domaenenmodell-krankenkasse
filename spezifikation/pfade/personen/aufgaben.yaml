parameters:
  - name: person_id
    in: path
    required: true
    description: Ressourcen-ID der Person.
    schema:
      $ref: '../../schemas/personen/person_id.yaml'
get:
  tags:
    - personen
  operationId: aufgaben_lesen
  summary: Aufgaben einer Person unabhängig vom Bearbeiter lesen
  description: |
    Liefert den aktuellen Aufgabenbestand der Person über alle Bearbeiter und Statuswerte, einschließlich unzugewiesener Aufgaben. Eine Bearbeiterauswahl ist nicht vorgesehen.

    Die Liste ist nach id aufsteigend sortiert. naechster_versatz wird nur bei weiteren Treffern geliefert; Folgeaufrufe behalten Person und Seitengröße bei. Zwischen Aufrufen sind Änderungen möglich. Ein unvollständiger Abruf ergibt 503 statt einer scheinbar vollständigen Seite.
  responses:
    '200':
      description: Zugängliche Daten im beschriebenen Umfang.
      content:
        application/json:
          schema:
            $ref: '../../schemas/aufgaben/aufgabenliste.yaml'
    '400':
      $ref: '../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    '404':
      $ref: '../../antworten/fehlerantworten.yaml#/person_nicht_gefunden'
    '500':
      $ref: '../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
  parameters:
    - name: seitengroesse
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: versatz
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
post:
  tags:
    - personen
  operationId: aufgabe_anlegen
  summary: Eine Aufgabe zur Person anlegen
  description: |
    Legt eine Aufgabe anhand einer freigegebenen Aufgabendefinition an. Status ist zunächst unbearbeitet; Zuweisung und weitere Standardwerte bestimmt die Definition. Ohne wiedervorlagedatum gilt deren Standard.

    Ungültige Eingaben ergeben 400. Eine unbekannte, inaktive oder nicht abbildbare Definition ergibt 422 aufgabe_nicht_abbildbar. 201 bestätigt die dauerhafte Anlage und die Zuordnung zur angegebenen Person. Bei unklarem Ausgang gilt 503; der Auftrag bleibt bis zur Klärung gesperrt. Fehler 500 und 503 beweisen keine Wirkungslosigkeit.

    Idempotency-Key ist Pflicht. Ein neuer Schlüssel kann eine weitere Aufgabe erzeugen; eine inhaltsbasierte Dublettenprüfung ist nicht vorgesehen.
  parameters:
    - $ref: ../../parameter/idempotenzschluessel.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/aufgaben/aufgabe_anlage.yaml'
  responses:
    '201':
      description: Aufgabe dauerhaft angelegt und der Person zugeordnet; derselbe Schlüssel wiederholt diesen Status.
      content:
        application/json:
          schema:
            $ref: '../../schemas/aufgaben/aufgabe_annahme.yaml'
    '400':
      $ref: '../../antworten/fehlerantworten.yaml#/ungueltige_anfrage'
    '404':
      $ref: '../../antworten/fehlerantworten.yaml#/person_nicht_gefunden'
    '500':
      $ref: '../../antworten/fehlerantworten.yaml#/interner_fehler'
    '503':
      $ref: '../../antworten/fehlerantworten.yaml#/dienst_nicht_verfuegbar'
    '409':
      description: Auftrag läuft oder Eingaben stehen im Konflikt.
      headers:
        Retry-After:
          description: Bei auftrag_in_bearbeitung vorhanden; frühester erneuter Versuch in Sekunden mit demselben
            Schlüssel.
          schema:
            type: integer
            minimum: 1
          example: 5
      content:
        application/json:
          schema:
            $ref: '../../schemas/gemeinsam/fehler.yaml'
          examples:
            abweichender_auftrag:
              value:
                code: idempotenzkonflikt
                meldung: Der Schlüssel gehört zu einem anderen Auftrag.
            laufender_auftrag:
              value:
                code: auftrag_in_bearbeitung
                meldung: Bitte denselben Auftrag nach der angegebenen Wartezeit wiederholen.
    '422':
      description: 'aufgabe_nicht_abbildbar: Definition oder Eingabe fachlich nicht umsetzbar; keine Anlage.'
      content:
        application/json:
          schema:
            $ref: '../../schemas/gemeinsam/fehler.yaml'
