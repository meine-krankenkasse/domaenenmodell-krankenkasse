zahlungskonto_id:
  type: string
  minLength: 1
  maxLength: 128
  pattern: ^[A-Za-z0-9]{1,128}$
  description: Dauerhaft gültige Kennung eines Zahlungskontos aus 1 bis 128 Buchstaben (A–Z, a–z) und Ziffern;
    keine Kontonummer. Groß- und Kleinschreibung sowie führende Nullen sind bedeutsam.
  examples:
    - zahlungskonto001

zahlungskonto:
  type: object
  description: Eigenes fachliches Zahlungskonto der Person bei der Krankenkasse, keine Bankverbindung.
  required:
    - id
    - kontonummer
    - status
  properties:
    id:
      $ref: '#/zahlungskonto_id'
    kontonummer:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[0-9]{1,128}$
      description: Fachliche Nummer des Zahlungskontos aus Ziffern. Führende Nullen bleiben erhalten; nicht als Zahl
        interpretieren, keine IBAN.
    status:
      $ref: '#/kontostatus'

kontostatus:
  type: string
  description: aktiv bezeichnet ein geführtes, geschlossen ein geschlossenes Zahlungskonto.
  enum:
    - aktiv
    - geschlossen

zahlungskontenliste:
  type: object
  description: Alle zugänglichen eigenen Zahlungskonten der Person einschließlich geschlossener, je Konto einmal.
    Die Reihenfolge ist nicht festgelegt.
  required:
    - data
  properties:
    data:
      type: array
      items:
        $ref: '#/zahlungskonto'

kontosaldo:
  type: object
  description: Saldo eines Zahlungskontos zum Ende eines Stichtags in Euro. Positiv bedeutet Guthaben der Person,
    negativ eine Forderung der Krankenkasse. Unbekannte Werte werden nicht als 0.00 geliefert.
  required:
    - stichtag
    - betrag
  properties:
    stichtag:
      type: string
      format: date
      description: Angefragter Stichtag, auf den sich der Saldo bezieht.
    betrag:
      $ref: '#/eurobetrag'

eurobetrag:
  type: string
  description: |-
    Exakter Betrag in Euro mit Punkt als Dezimaltrennzeichen, höchstens neun Stellen vor und genau zwei Stellen nach dem Punkt. Keine Tausendertrennzeichen, überflüssigen führenden Nullen oder führendes Plus; -0.00 ist unzulässig.
  pattern: '^-?(0|[1-9][0-9]{0,8})\.[0-9]{2}(?![\s\S])'
  not:
    const: '-0.00'
  examples:
    - '-125.50'
    - '42.00'
    - '0.00'
