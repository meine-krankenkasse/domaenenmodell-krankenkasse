type: string
description: |
  Exakter Dezimalbetrag mit Punkt und genau zwei Nachkommastellen, ohne
  Tausendertrennzeichen, führendes Plus oder führende Nullen. Null wird als 0.00
  geliefert; -0.00 ist nicht zulässig. Als Dezimalzahl verarbeiten, nicht als binäre Gleitkommazahl.
pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}(?![\s\S])'
not:
  const: '-0.00'
examples:
- '-125.50'
- '42.00'
- '0.00'
