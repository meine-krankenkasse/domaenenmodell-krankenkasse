type: string
description: |-
  Exakter Dezimalbetrag mit Punkt und zwei Nachkommastellen. Keine Tausendertrennzeichen, überflüssigen führenden Nullen oder führendes Plus; -0.00 ist unzulässig.
pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}(?![\s\S])'
not:
  const: '-0.00'
examples:
  - '-125.50'
  - '42.00'
  - '0.00'
