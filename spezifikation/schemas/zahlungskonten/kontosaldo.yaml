type: object
description: |-
  Tagesbezogener Euro-Saldo: positiv bedeutet Guthaben der Person, negativ eine Forderung der Krankenkasse. Der Saldo bestimmt weder Fälligkeit noch Auszahlbarkeit. Unbekannte Werte werden nicht als 0.00 geliefert.
required:
  - betrag
  - waehrung
  - stichtag
properties:
  betrag:
    $ref: 'dezimalbetrag.yaml'
  waehrung:
    type: string
    description: Währung des Saldos; dieser Abruf unterstützt ausschließlich Euro.
    const: EUR
  stichtag:
    type: string
    format: date
    description: Fachlicher Berechnungstag; das Abrufdatum in Europe/Berlin, kein Aktualisierungszeitstempel.
