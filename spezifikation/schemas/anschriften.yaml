anschrift:
  type: object
  properties:
    id:
      $ref: 'gemeinsam.yaml#/ressourcen_id'
    strasse:
      type: string
      minLength: 1
    hausnummer:
      type: string
      minLength: 1
    postfach:
      type: string
      minLength: 1
    postleitzahl:
      type: string
      minLength: 1
    ort:
      type: string
      minLength: 1
    zusatz:
      type: string
      minLength: 1
    land:
      type: string
      minLength: 1
    anschrift_in_pruefung:
      type: boolean
    art:
      type: string
      enum:
        - meldeanschrift
        - zustellanschrift
  required:
    - id
    - art
  description: Eigene postalische Anschrift. land ist die Länderbezeichnung, kein ISO-Code wie bei der Anschriftensuche. Unbekannte Bestandteile entfallen;
    Postfachanschriften benötigen keine Straße. Getrennte Anschriftenzuordnungen werden nicht anhand gleicher Anschrift
    zusammengeführt.
  examples:
    - id: anschrift-001
      strasse: Beispielweg
      hausnummer: '7'
      postleitzahl: '12345'
      ort: Beispielstadt
      land: Deutschland
      art: meldeanschrift

anschriftenliste:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/anschrift'
  required:
    - data
  description: "Vollständige Liste eigener, am Abrufdatum in Europe/Berlin gültiger Melde- und Zustellanschriften; Gültigkeitsgrenzen einschließlich. Nach id aufsteigend sortiert. Getrennte Zuordnungen bleiben auch bei gleicher Anschrift erhalten. Keine historischen Einträge oder Anschriften anderer Personen."
