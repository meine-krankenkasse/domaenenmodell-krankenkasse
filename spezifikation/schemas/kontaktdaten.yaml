kontaktdatum:
  type: object
  properties:
    id:
      $ref: 'gemeinsam.yaml#/ressourcen_id'
    art:
      type: string
      enum:
        - telefon
        - mobil
        - e_mail
    wert:
      type: string
      minLength: 1
      description: Gespeicherte Telefonnummer einschließlich bekannter Vorwahlen oder E-Mail-Adresse; keine Zusage
        eines verifizierten oder erreichbaren Anschlusses.
    verwendungszweck:
      type: string
      pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
      examples:
        - privat
        - geschaeftlich
    bevorzugt:
      type: boolean
      description: Kennzeichnet dieses konkrete Kontaktdatum als bevorzugt. Begründet weder eine Rangfolge zwischen verschiedenen Kommunikationskanälen noch eine Einwilligung; fehlend bedeutet unbekannt oder nicht geliefert.
    bemerkung:
      type: string
      minLength: 1
      maxLength: 100
  required:
    - id
    - art
    - wert
  examples:
    - id: kontaktdatum-001
      art: e_mail
      wert: person@example.org
      verwendungszweck: privat
      bevorzugt: true

kontaktdatenliste:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/kontaktdatum'
  required:
    - data
  description: "Vollständige Liste eigener, am Abrufdatum in Europe/Berlin gültiger Kontaktdaten; Gültigkeitsgrenzen einschließlich. Nach id aufsteigend sortiert. Keine historischen Einträge oder Kommunikationsereignisse. Fehlende Telefonvorwahlen werden nicht ergänzt."
