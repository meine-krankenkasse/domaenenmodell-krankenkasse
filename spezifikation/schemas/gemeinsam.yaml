fehler:
  type: object
  required:
    - code
    - meldung
  description: Einheitliche Fehlerantwort ohne personenbezogene Suchwerte oder interne Implementierungsdetails.
  properties:
    code:
      type: string
      pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
      description: Stabiler deutscher Fehlercode. Erweiterungen sind möglich.
      examples:
        - ungueltige_anfrage
        - person_nicht_gefunden
        - treffermenge_zu_gross
        - dienst_nicht_verfuegbar
        - interner_fehler
    meldung:
      type: string
      description: Deutsche Erläuterung, nicht zur maschinellen Fallunterscheidung.
    parameter_hinweise:
      type: array
      minItems: 1
      items:
        $ref: '#/parameter_hinweis'
      description: Optionale Hinweise zur gezielten Korrektur einer Anfrage; keine Wiedergabe der Eingabewerte.

idempotenzschluessel:
  type: string
  format: uuid
  pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  description: Zufällige UUIDv4 in kanonischer Kleinschreibung; bei Wiederholungen unverändert verwenden.

parameter_hinweis:
  type: object
  required:
    - parameter
    - grund
  description: Strukturierter Korrekturhinweis ohne personenbezogene Eingabewerte.
  properties:
    parameter:
      type: string
      description: Betroffener Parameter beziehungsweise Punktpfad im Suchobjekt, beispielsweise adresse.land.
    grund:
      type: string
      pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
      description: Maschinenlesbarer deutscher Hinweiscode.
      examples:
        - pflichtangabe_fehlt
        - format_ungueltig
        - suchkombination_unzureichend
        - unbekanntes_feld

ressourcen_id:
  type: string
  minLength: 1
  maxLength: 128
  pattern: ^[A-Za-z0-9_-]+$
  description: Undurchsichtige Ressourcen-ID innerhalb des Mandanten.
