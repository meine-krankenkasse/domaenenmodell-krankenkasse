type: object
required:
  - data
properties:
  data:
    type: array
    maxItems: 100
    items:
      $ref: 'kontakt.yaml'
    description: Zugängliche Kontakte dieser Seite in der beschriebenen Sortierung; höchstens seitengroesse Einträge.
  naechster_versatz:
    type: integer
    minimum: 1
    description: Anzahl bereits gelieferter und übersprungener zugänglicher Treffer; fehlt auf der letzten Seite.
