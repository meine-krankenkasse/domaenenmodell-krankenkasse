type: object
required:
- id
description: |
  Kommunikationsereignis mit im Aufrufkontext zugänglichen Angaben. Optionale Felder werden
  bei fehlender Kenntnis oder Freigabe weggelassen; das ist kein fachlicher Negativbefund.
  Fehlende maschinell_erzeugt-Angaben dürfen nicht als false interpretiert werden.
  Die Textgrenzen der Anlage gelten nicht rückwirkend für bestehende Kontaktdokumentationen.
properties:
  id:
    $ref: 'kontakt_id.yaml'
  kontakt_am:
    type: string
    format: date-time
    description: Zeitpunkt des Kommunikationsereignisses mit verlässlich bestimmter Zeitzone; fehlt bei
      unbekannter Zeit. Kein Ersatz durch den Erstellungszeitpunkt.
  kanal:
    $ref: 'kontaktkanal.yaml'
  richtung:
    $ref: 'kontaktrichtung.yaml'
  status:
    type: string
    pattern: ^[a-z][a-z0-9_]*$
    description: Bearbeitungsstatus, beispielsweise erledigt, storniert oder in_bearbeitung. Weitere
      Antwortcodes müssen toleriert werden; unbekannte Angaben fehlen.
  betreff:
    type: string
    description: Zugängliche Kurzbeschreibung als Klartext; vorhandene Inhalte werden nicht abgeschnitten.
  bemerkung:
    type: string
    description: Zugängliche Gesprächsdokumentation als Klartext; keine Garantie eines vollständigen
      Transkripts.
  maschinell_erzeugt:
    type: boolean
    description: Kennzeichnung automatisch erzeugter Dokumentation, soweit bekannt.
  externe_id:
    type: string
    maxLength: 64
    description: Gespeicherte externe Ereigniskennung, soweit bekannt und zugänglich. Bestehende Werte werden
      unverändert geliefert.
  archiviert:
    type: boolean
    description: Kennzeichnet einen archivierten Kontakt, soweit verlässlich bestimmt. Archivierte Kontakte
      bleiben im Abruf enthalten.
  erstellt_am:
    type: string
    format: date-time
    description: Erstellungszeitpunkt der Dokumentation mit verlässlich bestimmter Zeitzone; kein Ersatz für
      kontakt_am.
  fachlicher_inhalt:
    type: string
    description: Fachliche Einordnung des Kontakts als aufgelöste Bezeichnung, soweit bekannt und zugänglich.
  stichwort:
    $ref: 'kontakt_stichwort.yaml'
  herkunft:
    type: string
    description: Fachliche Herkunftsangabe, soweit zugänglich; keine interne System- oder Datenbankzuordnung.
  dokument_id:
    type: string
    minLength: 1
    maxLength: 254
    description: Undurchsichtige Referenz auf ein zugeordnetes Dokument. Kein Zugriffsrecht und keine Zusage
      einer Dokumentabruf-Fähigkeit.
