type: object
additionalProperties: false
required:
  - kontakt_am
  - kanal
  - status
  - betreff
  - bemerkung
  - maschinell_erzeugt
properties:
  kontakt_am:
    type: string
    format: date-time
    description: Tatsächlicher Zeitpunkt des Kommunikationsereignisses mit Zeitzone, nicht Zeitpunkt der Speicherung.
  kanal:
    $ref: 'kontaktkanal.yaml'
  status:
    $ref: 'kontaktstatus.yaml'
  richtung:
    $ref: 'kontaktrichtung.yaml'
  betreff:
    $ref: 'kontakt_betreff.yaml'
  bemerkung:
    $ref: 'kontakt_bemerkung.yaml'
  maschinell_erzeugt:
    type: boolean
    description: true, wenn die eingereichte Gesprächsdokumentation automatisch erzeugt wurde. Unabhängig vom
      Kommunikationskanal.
  externe_id:
    $ref: 'externe_kontakt_id.yaml'
allOf:
  - if:
      properties:
        maschinell_erzeugt:
          const: true
      required:
        - maschinell_erzeugt
    then:
      required:
        - externe_id
