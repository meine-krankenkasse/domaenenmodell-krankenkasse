type: object
required:
  - id
description: Natürlicher Mensch unabhängig von Versicherung und fachlichen Rollen. Fehlende Angaben sind
  unbekannt oder nicht geliefert.
properties:
  betreuungshinweise:
    type: array
    items:
      $ref: 'betreuungshinweis.yaml'
    description: Am Abrufdatum in Europe/Berlin gültige Betreuungshinweise. Sie belegen keine konkrete
      Vertretungsbefugnis.
  id:
    $ref: 'person_id.yaml'
  name:
    $ref: 'personenname.yaml'
  geburtsdatum:
    type: string
    format: date
    description: Vollständig bekanntes Geburtsdatum; unvollständige Angaben werden weggelassen.
  geschlecht:
    type: string
    enum:
      - maennlich
      - weiblich
      - unbestimmt
      - divers
    description: Fachliche Geschlechtsangabe. Eine unbekannte oder nicht verfügbare Angabe wird weggelassen und
      nicht automatisch als unbestimmt ausgegeben.
  identifikatoren:
    type: array
    description: Aktuell gültige Personenkennungen.
    items:
      $ref: 'identifikator.yaml'
  rollen:
    type: array
    description: Fachliche Rollen; je code höchstens ein Eintrag.
    items:
      $ref: 'personenrolle.yaml'
