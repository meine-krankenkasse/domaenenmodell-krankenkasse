type: object
properties:
  id:
    $ref: '../gemeinsam/ressourcen_id.yaml'
  art:
    type: string
    enum:
    - telefon
    - mobil
    - e_mail
  wert:
    type: string
    minLength: 1
    description: Gespeicherte Telefonnummer einschließlich bekannter Vorwahlen oder E-Mail-Adresse; keine
      Zusage eines verifizierten oder erreichbaren Anschlusses.
  verwendungszweck:
    type: string
    pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
    examples:
    - privat
    - geschaeftlich
  bevorzugt:
    type: boolean
  bemerkung:
    type: string
    minLength: 1
    maxLength: 100
required:
- id
- art
- wert
examples:
- id: kontaktdatum-001
  art: e_mail
  wert: person@example.org
  verwendungszweck: privat
  bevorzugt: true
