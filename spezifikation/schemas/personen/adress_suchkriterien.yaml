type: object
additionalProperties: false
required:
  - land
anyOf:
  - required:
      - postleitzahl
  - required:
      - ort
dependentRequired:
  hausnummer:
    - strasse
description: Kriterien für eine eigene, aktuell gültige Melde- oder Zustelladresse der Person. Land und
  mindestens Postleitzahl oder Ort sind erforderlich. Sämtliche Adresskriterien müssen dieselbe Adresse
  erfüllen. Anschriften von Vertretern oder abweichenden Empfängern zählen nicht als eigene Adresse.
properties:
  postleitzahl:
    type: string
    minLength: 1
    maxLength: 20
    pattern: \S
    description: Vollständige Postleitzahl als String, einschließlich führender Nullen. Für DE genau fünf Ziffern;
      international sind auch Buchstaben und Zwischenräume möglich.
  ort:
    type: string
    minLength: 1
    maxLength: 200
    pattern: \S
    description: Vollständige Ortsbezeichnung.
  strasse:
    type: string
    minLength: 1
    maxLength: 200
    pattern: \S
    description: Vollständiger Straßenname. Keine automatische Gleichsetzung von Straße und Str. oder anderer Abkürzungen.
  hausnummer:
    type: string
    minLength: 1
    maxLength: 30
    pattern: \S
    description: Vollständige Hausnummer einschließlich vorhandenen Zusatzes, beispielsweise 12a.
  land:
    type: string
    pattern: ^[A-Z]{2}$
    description: Land als gültiger ISO-3166-1-Alpha-2-Code, beispielsweise DE; keine Länderbezeichnung wie beim Adressabruf. Kein stillschweigender
      Standardwert. Der Zeichenaufbau allein bestätigt noch keinen vergebenen Ländercode.
    examples:
      - DE
      - AT
allOf:
  - if:
      properties:
        land:
          const: DE
      required:
        - land
    then:
      properties:
        postleitzahl:
          pattern: ^[0-9]{5}$
          minLength: 5
          maxLength: 5
