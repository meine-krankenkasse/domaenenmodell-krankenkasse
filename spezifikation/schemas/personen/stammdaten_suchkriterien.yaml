type: object
additionalProperties: false
required:
  - nachname
anyOf:
  - required:
      - geburtsdatum
  - required:
      - vorname
      - adresse
description: "Alle Angaben gelten gemeinsam. Erforderlich sind Nachname und Geburtsdatum oder Vorname, Nachname und Adresse mit Land sowie Postleitzahl oder Ort. Textvergleich nach Unicode-Normalisierung NFC, Kleinschreibung, Entfernen äußeren und Vereinheitlichen zusammenhängenden Leerraums: vollständige Gleichheit, einschließlich Umlauten, ß, Satzzeichen und Bindestrichen. Mehrere Vornamen werden zusammen verglichen; Geburtsdaten als vollständige Kalenderdaten, Postleitzahlen als Text. Ländercodes bleiben Großbuchstaben. Adresskriterien müssen gemeinsam eine eigene, aktuell gültige Melde- oder Zustelladresse erfüllen. Fehlende Merkmale erfüllen das Kriterium nicht."
properties:
  vorname:
    type: string
    minLength: 1
    maxLength: 200
    pattern: \S
    description: Vollständige bekannte Vornamensangabe. Bei mehreren Vornamen wird die gesamte Angabe verglichen,
      keine automatische Suche nur nach dem ersten Vornamen. Bei Unsicherheit weglassen und Nachname plus
      Geburtsdatum verwenden.
  nachname:
    type: string
    minLength: 1
    maxLength: 200
    pattern: \S
    description: Vollständiger Familienname entsprechend name.nachname; separat geführte Vorsatzwörter und
      Namenszusätze nicht anhängen. Bei unklarer Zerlegung zusätzliche Angaben einholen.
  geburtsdatum:
    type: string
    format: date
    description: Vollständiges Geburtsdatum im Format JJJJ-MM-TT. Teilangaben oder erfundene Ersatzdaten sind
      nicht zulässig.
  adresse:
    $ref: 'adress_suchkriterien.yaml'
