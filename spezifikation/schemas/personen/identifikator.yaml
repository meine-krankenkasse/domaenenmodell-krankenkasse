type: object
required:
  - art
  - wert
description: |-
  Aktuell gültige fachliche Personenkennung. Gültigkeitsangaben beziehen sich auf die Kennung, nicht auf ein Versicherungsverhältnis.
properties:
  art:
    $ref: 'identifikator_art.yaml'
  wert:
    type: string
    minLength: 1
    maxLength: 128
    description: Wert als Zeichenfolge einschließlich führender Nullen.
  gueltig_ab:
    type: string
    format: date
    description: Erster Gültigkeitstag, soweit fachlich bekannt; keine technischen Ersatzdaten.
  gueltig_bis:
    type: string
    format: date
    description: Letzter Gültigkeitstag einschließlich; bei offenem Ende weggelassen.
allOf:
  - if:
      properties:
        art:
          const: krankenversicherungsnummer
      required:
        - art
    then:
      properties:
        wert:
          $ref: krankenversicherungsnummer.yaml
  - if:
      properties:
        art:
          const: rentenversicherungsnummer
      required:
        - art
    then:
      properties:
        wert:
          $ref: rentenversicherungsnummer.yaml
  - if:
      properties:
        art:
          const: partnernummer
      required:
        - art
    then:
      properties:
        wert:
          $ref: partnernummer.yaml
