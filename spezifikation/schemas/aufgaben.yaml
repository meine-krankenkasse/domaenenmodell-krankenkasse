aufgabe:
  type: object
  properties:
    id:
      $ref: 'gemeinsam.yaml#/ressourcen_id'
    status:
      $ref: '#/aufgabenstatus'
    info:
      description: Kurze Bezeichnung des zu bearbeitenden Anliegens.
      type: string
      minLength: 1
      maxLength: 50
    bemerkung:
      description: Beschreibung des Anliegens und der für seine Bearbeitung benötigten Angaben.
      type: string
      minLength: 1
      maxLength: 2000
    vorgangsnotiz:
      description: Ergänzende Notiz zum bisherigen Bearbeitungsverlauf; keine vollständige Änderungshistorie.
      type: string
      minLength: 1
      maxLength: 1200
    wiedervorlagedatum:
      type: string
      format: date
      description: Fachliches Datum ohne Uhrzeit.
    erstellt_am:
      type: string
      format: date-time
    geschlossen_am:
      type: string
      format: date
    bearbeiter_id:
      $ref: 'gemeinsam.yaml#/ressourcen_id'
  required:
    - id
  description: Zugängliche Aufgabenangaben. Fehlende Felder bedeuten nicht geliefert. bemerkung und
    vorgangsnotiz geben den aktuellen Inhalt wieder, keine Änderungshistorie.
  examples:
    - id: aufgabe-001
      status: unbearbeitet
      info: Rückfrage prüfen
      bearbeiter_id: mitarbeiter-001

aufgabe_anlage:
  type: object
  properties:
    aufgabenvorlage:
      type: string
      minLength: 1
      maxLength: 120
      description: Stabile fachliche Kennung einer freigegebenen Aufgabenvorlage. Sie bestimmt Standardwerte und automatische Zuweisung. Ihr vereinbarter Katalog gilt unabhängig von internen Konfigurationsnamen; die Zuordnung übernimmt die Implementierung.
    info:
      description: Kurze Bezeichnung des zu bearbeitenden Anliegens.
      type: string
      minLength: 1
      maxLength: 50
    bemerkung:
      description: Beschreibung des Anliegens und der für seine Bearbeitung benötigten Angaben.
      type: string
      minLength: 1
      maxLength: 2000
    vorgangsnotiz:
      description: Ergänzende Notiz zum bisherigen Bearbeitungsverlauf; keine vollständige Änderungshistorie.
      type: string
      minLength: 1
      maxLength: 1200
    wiedervorlagedatum:
      type: string
      format: date
      description: Fachliches Datum ohne Uhrzeit.
  required:
    - aufgabenvorlage
  additionalProperties: false
  examples:
    - aufgabenvorlage: allgemeine_bearbeitung
      info: Rückfrage prüfen
      bemerkung: Die vorliegenden Angaben prüfen.
      wiedervorlagedatum: '2026-11-10'
  description: "Die freigegebene Aufgabenvorlage bestimmt Zuweisung und Standardwerte, einschließlich des wiedervorlagedatums bei fehlender Angabe. Anfangsstatus ist unbearbeitet."

aufgabe_annahme:
  type: object
  properties:
    id:
      $ref: 'gemeinsam.yaml#/ressourcen_id'
    person_id:
      $ref: 'personen.yaml#/person_id'
  required:
    - id
    - person_id
  examples:
    - id: aufgabe-001
      person_id: person-001

aufgabenliste:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/aufgabe'
      maxItems: 100
    naechster_versatz:
      type: integer
      minimum: 1
  required:
    - data
  examples:
    - data: []
  description: "Nach id aufsteigend sortierte Seite. naechster_versatz erscheint nur bei weiteren Treffern; Folgeaufrufe behalten Person und Seitengröße bei. Zwischen Aufrufen sind Änderungen möglich."

aufgabenstatus:
  type: string
  enum:
    - unbearbeitet
    - in_bearbeitung
    - erledigt
    - in_wiedervorlage
    - nachbearbeitung_laeuft
    - storniert
    - weitergeleitet
