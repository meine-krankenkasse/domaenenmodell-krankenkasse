buchung_id:
  type: string
  minLength: 1
  maxLength: 128
  pattern: ^[A-Za-z0-9_-]{1,128}$
  description: Dauerhaft gültige, eindeutige Kennung einer Kontobewegung auf dem Zahlungskonto; keine Belegnummer.
  examples:
    - buchung-beispiel-001

kontobewegung:
  type: object
  description: Buchung auf dem Zahlungskonto mit dem Saldo unmittelbar danach.
  required:
    - nummer
    - id
    - buchungsdatum
    - betrag
    - saldo_nach_buchung
    - buchungsart
  properties:
    nummer:
      type: integer
      minimum: 0
      description: Position in der sortierten Ergebnisliste des Zeitraums, beginnend bei 0 für die neueste Bewegung;
        entspricht versatz plus Index auf der Seite. Nur innerhalb derselben Abfrage aussagekräftig, keine Kennung.
    id:
      $ref: '#/buchung_id'
    buchungsdatum:
      type: string
      format: date
      description: Fachliches Buchungsdatum; Grundlage von Zeitfilter und Sortierung.
    betrag:
      description: Betrag der Buchung in Euro. Positiv bedeutet Gutschrift oder Zahlungseingang, negativ Belastung oder
        Forderung.
      allOf:
        - $ref: 'zahlungskonten.yaml#/eurobetrag'
    saldo_nach_buchung:
      description: Saldo des Zahlungskontos unmittelbar nach dieser Buchung, mit derselben Vorzeichenregel wie der
        Kontosaldo.
      allOf:
        - $ref: 'zahlungskonten.yaml#/eurobetrag'
    buchungsart:
      $ref: '#/buchungsart'
    ausgeglichene_posten:
      type: array
      minItems: 1
      description: Kennungen der Kontobewegungen auf diesem Zahlungskonto, die dieser Zahlungseingang ausgleicht; auch
        außerhalb des angefragten Zeitraums. Nur bei buchungsart zahlungseingang; fehlend bedeutet nicht geliefert.
      items:
        $ref: '#/buchung_id'
  allOf:
    - if:
        required:
          - ausgeglichene_posten
      then:
        properties:
          buchungsart:
            const: zahlungseingang

buchungsart:
  type: string
  description: |
    Fachliche Art der Buchung: zahlungseingang für eingehende Zahlungen, beitrag für Beitragsforderungen,
    mahngebuehr, bankgebuehr und vollstreckungsgebuehr für Gebühren, stundungszins für Zinsen auf gestundete
    Forderungen, saeumniszuschlag für Säumniszuschläge, korrektur für Korrekturbuchungen, storno für Stornobuchungen
    und sonstige für alle übrigen Buchungen.
  enum:
    - zahlungseingang
    - beitrag
    - mahngebuehr
    - bankgebuehr
    - vollstreckungsgebuehr
    - stundungszins
    - saeumniszuschlag
    - korrektur
    - storno
    - sonstige

kontobewegungsliste:
  type: object
  description: Eine Seite der Kontobewegungen im Zeitraum, absteigend nach buchungsdatum sortiert; Bewegungen desselben
    Tages in umgekehrter Buchungsreihenfolge, sodass saldo_nach_buchung der neuesten Bewegung zuerst steht. Folgeaufrufe
    verwenden unveränderte Filter; Änderungen zwischen Seiten sind möglich.
  required:
    - gesamtanzahl
    - data
  properties:
    gesamtanzahl:
      type: integer
      minimum: 0
      description: Anzahl aller zugänglichen Kontobewegungen im Zeitraum, unabhängig von seitengroesse und versatz.
    data:
      type: array
      maxItems: 100
      items:
        $ref: '#/kontobewegung'
